
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://ongolebulls-db.cbqqc0wcszzt.ap-south-2.rds.amazonaws.com:3306/ongolebulls?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: admin
    password: XqweXuUHRxj3C2m


  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:

    host: ${EMAIL_HOST:mail.ongolebullsinvest.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:info@ongolebullsinvest.com}
    password: ${EMAIL_PASSWORD:Ongole@bulls@2024}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.enable: false
      mail.debug: true

  security:
    user:
      # Spring Boot HTTP basic (e.g. Swagger) — not the Website Controls CMS login
      name: ${SPRING_SECURITY_USER_NAME:ob-api}
      password: ${SPRING_SECURITY_USER_PASSWORD:ob-local-dev-only}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  main:
    allow-circular-references: true # Fixed key syntax

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  enabled: true

encryption:
  key: lTB/6CsfDkNm46qjwXf/NuFx09ddhVU0z6rO7VJcyeA=

# Website Controls — seed user in ob_admin_users (POST /api/admin/login). Override in prod.
website:
  controls:
    seed:
      email: ${WEBSITE_CONTROLS_EMAIL:controls@ongolebullsinvest.com}
      password: ${WEBSITE_CONTROLS_PASSWORD:controls123}
      name: ${WEBSITE_CONTROLS_NAME:Website Controls}
    # Remove old dummy admin row so only Website Controls credentials work (set false to keep both)
    migration:
      remove-legacy-seed-user: ${WEBSITE_CONTROLS_REMOVE_LEGACY:true}
      legacy-email: ${WEBSITE_CONTROLS_LEGACY_EMAIL:admin@ongolebullsinvest.com}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Exchange API Configuration
bse:
  starmf:
    api:
      url: ${BSE_STARMF_API_URL:https://www.bsestarmf.in/RptWebService/WebService.asmx}
    member:
      id: ${BSE_MEMBER_ID:}
    user:
      id: ${BSE_USER_ID:}
    password: ${BSE_PASSWORD:}
    v2:
      base-url: ${BSE_V2_BASE_URL:https://starmfv2wrapper.bseindia.com}
      username: ${BSE_V2_USERNAME:}
      password: ${BSE_V2_PASSWORD:}
      member-code: ${BSE_V2_MEMBER_CODE:}
      fingerprint: ${BSE_V2_FINGERPRINT:}
      private-key-path: ${BSE_V2_PRIVATE_KEY_PATH:}
      bse-public-key-path: ${BSE_V2_BSE_PUBLIC_KEY_PATH:}
      token-refresh-minutes: ${BSE_V2_TOKEN_REFRESH_MINUTES:55}
      mock-mode: ${BSE_V2_MOCK_MODE:true}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-secure-32-char-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}


