<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Profile with Investments</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
          background: #f8f9fa;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          padding: 2rem;
          color: #343a40;
        }

        .profile-card {
          max-width: 700px;
          margin: auto;
          background: white;
          border-radius: 1rem;
          box-shadow: 0 8px 24px rgb(0 0 0 / 0.12);
          padding: 2rem;
          position: relative;
          overflow: hidden;
        }

        /* Animated gradient border */
        .profile-card::before {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: 1rem;
          padding: 3px;
          background: linear-gradient(270deg, #00b4db, #0083b0, #00b4db, #0083b0);
          background-size: 600% 600%;
          animation: gradientShift 10s ease infinite;
          -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);
          -webkit-mask-composite: destination-out;
          mask-composite: exclude;
          pointer-events: none;
          z-index: 0;
        }

        @keyframes gradientShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .profile-card > * {
          position: relative;
          z-index: 1;
        }

        .profile-header {
          text-align: center;
          margin-bottom: 2rem;
        }

        .profile-img {
          width: 120px;
          height: 120px;
          border-radius: 50%;
          border: 4px solid #00b4db;
          object-fit: cover;
          transition: transform 0.3s ease;
          cursor: pointer;
        }
        .profile-img:hover {
          transform: scale(1.1);
          box-shadow: 0 0 15px #00b4db;
        }

        h2 {
          margin-top: 1rem;
          font-weight: 700;
          color: #007bff;
        }

        .info-list {
          list-style: none;
          padding: 0;
          margin: 0 0 2rem 0;
        }
        .info-list li {
          display: flex;
          align-items: center;
          padding: 0.75rem 0;
          border-bottom: 1px solid #e9ecef;
          font-size: 1.05rem;
          color: #495057;
          transition: background-color 0.3s ease;
        }
        .info-list li:last-child {
          border-bottom: none;
        }
        .info-list li i {
          margin-right: 1rem;
          color: #007bff;
          font-size: 1.3rem;
          min-width: 30px;
          text-align: center;
        }
        .info-list li:hover {
          background-color: #e7f1ff;
          border-radius: 0.5rem;
          cursor: default;
        }

        .btn-edit {
          display: block;
          margin: 2rem auto 3rem auto;
          padding: 0.6rem 2rem;
          font-weight: 600;
          border-radius: 50px;
          background: #007bff;
          color: white;
          border: none;
          box-shadow: 0 6px 15px rgb(0 123 255 / 0.4);
          transition: background-color 0.3s ease, box-shadow 0.3s ease;
          cursor: pointer;
        }
        .btn-edit:hover {
          background: #0056b3;
          box-shadow: 0 8px 22px rgb(0 86 179 / 0.7);
        }

        /* Investments Section */
        .investments-section {
          max-width: 700px;
          margin: auto;
          margin-bottom: 3rem;
        }
        .investments-section h3 {
          color: #007bff;
          font-weight: 700;
          margin-bottom: 1.5rem;
          text-align: center;
        }

        .investment-cards {
          display: flex;
          gap: 1rem;
          flex-wrap: wrap;
          justify-content: center;
        }

        .investment-card {
          background: white;
          flex: 1 1 150px;
          min-width: 150px;
          max-width: 180px;
          border-radius: 1rem;
          padding: 1.2rem 1rem;
          box-shadow: 0 6px 15px rgb(0 0 0 / 0.1);
          text-align: center;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
          cursor: default;
          user-select: none;
        }
        .investment-card:hover {
          transform: translateY(-6px);
          box-shadow: 0 12px 28px rgb(0 0 0 / 0.15);
        }

        .investment-card i {
          font-size: 2.5rem;
          margin-bottom: 0.7rem;
          color: #00b4db;
          animation: iconPulse 3s infinite ease-in-out;
        }

        @keyframes iconPulse {
          0%, 100% { transform: scale(1); color: #00b4db; }
          50% { transform: scale(1.1); color: #0083b0; }
        }

        .investment-value {
          font-weight: 700;
          font-size: 1.6rem;
          color: #007bff;
          margin-bottom: 0.2rem;
        }
        .investment-label {
          font-weight: 600;
          color: #495057;
        }

        /* Modal Styles */
        .modal-header {
          background: linear-gradient(90deg, #00b4db, #0083b0);
          color: white;
          font-weight: 700;
          border-bottom: none;
        }
        .modal-footer {
          border-top: none;
        }

        /* Input focus animation */
        .form-control:focus {
          border-color: #00b4db;
          box-shadow: 0 0 8px #00b4db;
          transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>

<div class="profile-card shadow-sm">
    <div class="profile-header">
        <img
                src="https://i.pravatar.cc/150?img=12"
                alt="User Profile Picture"
                class="profile-img"
                id="profilePic"
                title="Click to change picture"
        />
        <h2>Ambika Ambika</h2>
        <p class="text-muted">Full Stack Developer</p>
    </div>

    <ul class="info-list">
        <li><i class="bi bi-envelope-fill"></i> ambika@example.com</li>
        <li><i class="bi bi-phone-fill"></i> +91 98765 43210</li>
        <li><i class="bi bi-geo-alt-fill"></i> Bengaluru, India</li>
        <li><i class="bi bi-calendar-fill"></i> Joined: Aug 2023</li>
    </ul>

    <button class="btn-edit" data-bs-toggle="modal" data-bs-target="#editProfileModal">
        <i class="bi bi-pencil-square me-2"></i>Edit Profile
    </button>
</div>

<!-- Investments Summary -->
<section class="investments-section">
    <h3>Investment Summary</h3>
    <div class="investment-cards">
        <div class="investment-card" title="Total Investment Amount">
            <i class="bi bi-currency-rupee"></i>
            <div class="investment-value" id="totalInvestment">₹0</div>
            <div class="investment-label">Total Invested</div>
        </div>
        <div class="investment-card" title="Number of SIPs">
            <i class="bi bi-arrow-repeat"></i>
            <div class="investment-value" id="sipCount">0</div>
            <div class="investment-label">SIPs</div>
        </div>
        <div class="investment-card" title="Number of Mutual Funds">
            <i class="bi bi-pie-chart-fill"></i>
            <div class="investment-value" id="mfCount">0</div>
            <div class="investment-label">Mutual Funds</div>
        </div>
        <div class="investment-card" title="Number of Stocks">
            <i class="bi bi-bar-chart-fill"></i>
            <div class="investment-value" id="stocksCount">0</div>
            <div class="investment-label">Stocks</div>
        </div>
    </div>
</section>

<!-- Edit Profile Modal -->
<div
        class="modal fade"
        id="editProfileModal"
        tabindex="-1"
        aria-labelledby="editProfileModalLabel"
        aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header">
                <h5 class="modal-title" id="editProfileModalLabel">
                    Edit Profile
                </h5>
                <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                ></button>
            </div>
            <form id="editProfileForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="inputName" class="form-label">Full Name</label>
                        <input
                                type="text"
                                class="form-control"
                                id="inputName"
                                value="Ambika Ambika"
                                required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label">Email address</label>
                        <input
                                type="email"
                                class="form-control"
                                id="inputEmail"
                                value="ambika@example.com"
                                required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="inputPhone" class="form-label">Phone Number</label>
                        <input
                                type="tel"
                                class="form-control"
                                id="inputPhone"
                                value="+91 98765 43210"
                                pattern="[0-9+ -]{10,15}"
                                required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="inputLocation" class="form-label">Location</label>
                        <input
                                type="text"
                                class="form-control"
                                id="inputLocation"
                                value="Bengaluru, India"
                                required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="inputRole" class="form-label">Role</label>
                        <input
                                type="text"
                                class="form-control"
                                id="inputRole"
                                value="Full Stack Developer"
                                required
                        />
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const profilePic = document.getElementById('profilePic');
    profilePic.addEventListener('click', () => {
      alert('Here you can add functionality to change the profile picture.');
    });

    document.getElementById('editProfileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Get form values
      const name = document.getElementById('inputName').value.trim();
      const email = document.getElementById('inputEmail').value.trim();
      const phone = document.getElementById('inputPhone').value.trim();
      const location = document.getElementById('inputLocation').value.trim();
      const role = document.getElementById('inputRole').value.trim();

      // Update the profile card UI and close modal
      document.querySelector('.profile-card h2').textContent = name;
      document.querySelector('.profile-card .text-muted').textContent = role;
      const infoItems = document.querySelectorAll('.info-list li');
      infoItems[0].innerHTML = `<i class="bi bi-envelope-fill"></i> ${email}`;
      infoItems[1].innerHTML = `<i class="bi bi-phone-fill"></i> ${phone}`;
      infoItems[2].innerHTML = `<i class="bi bi-geo-alt-fill"></i> ${location}`;

      const modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
      modal.hide();
    });

    // Investment data (dummy data)
    const investmentsData = {
      totalInvestment: 1250000,  // ₹12,50,000
      sipCount: 7,
      mfCount: 12,
      stocksCount: 5
    };

    // Animate number count up
    function animateCountUp(id, target, duration = 1500) {
      const el = document.getElementById(id);
      let start = 0;
      const increment = target / (duration / 30);

      const counter = setInterval(() => {
        start += increment;
        if (start >= target) {
          start = target;
          clearInterval(counter);
        }
        el.textContent = (id === 'totalInvestment' ? '₹' : '') + Math.floor(start).toLocaleString('en-IN');
      }, 30);
    }

    // Initialize investments on page load
    window.onload = () => {
      animateCountUp('totalInvestment', investmentsData.totalInvestment);
      animateCountUp('sipCount', investmentsData.sipCount);
      animateCountUp('mfCount', investmentsData.mfCount);
      animateCountUp('stocksCount', investmentsData.stocksCount);
    };
</script>
</body>
</html>
