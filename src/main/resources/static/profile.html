<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile | Ongole Bulls Invest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background-color: #f7f9fc;
        }
        .profile-card {
          max-width: 900px;
          margin: 50px auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
          padding: 30px;
        }
        .profile-header {
          text-align: center;
          margin-bottom: 30px;
        }
        .edit-btn {
          float: right;
        }
        .form-control[readonly] {
          background-color: #f8f9fa;
          cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="profile-card">
        <div class="profile-header">
            <h3>My Profile</h3>
            <button class="btn btn-sm btn-primary edit-btn" id="editBtn">Edit</button>
        </div>

        <form id="profileForm">
            <h5 class="text-primary mt-3">Personal Information</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Email</label>
                    <input type="text" id="email" class="form-control" readonly>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Mobile</label>
                    <input type="text" id="mobileNumber" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Date of Birth</label>
                    <input type="text" id="dob" class="form-control" readonly>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Gender</label>
                    <input type="text" id="gender" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control" readonly>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label>City</label>
                    <input type="text" id="city" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label>State</label>
                    <input type="text" id="state" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label>Pincode</label>
                    <input type="text" id="pincode" class="form-control" readonly>
                </div>
            </div>

            <h5 class="text-primary mt-4">Bank Details</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Bank Name</label>
                    <input type="text" id="bankName" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>IFSC</label>
                    <input type="text" id="ifsc" class="form-control" readonly>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Account Holder</label>
                    <input type="text" id="accountHolderName" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Account Number</label>
                    <input type="text" id="accountNumber" class="form-control" readonly>
                </div>
            </div>

            <h5 class="text-primary mt-4">KYC & Risk Profile</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>PAN</label>
                    <input type="text" id="panNumber" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Aadhaar</label>
                    <input type="text" id="aadhaarNumber" class="form-control" readonly>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Occupation</label>
                    <input type="text" id="occupation" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Income Range</label>
                    <input type="text" id="annualIncomeRange" class="form-control" readonly>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-md-6">
                    <label>Risk Category</label>
                    <input type="text" id="riskCategory" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Risk Score</label>
                    <input type="text" id="riskScore" class="form-control" readonly>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" id="saveBtn" class="btn btn-success d-none">Save Changes</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary d-none">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId"); // stored after login

    if (!userId) {
      alert("User not logged in");
      window.location.href = "sign-in.html";
    }

    const form = document.getElementById("profileForm");
    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    // Load user data
    async function loadUserProfile() {
      try {
        const res = await fetch(`/api/user/profile/${userId}`);
        if (!res.ok) throw new Error("Failed to load profile");

        const data = await res.json();
        Object.keys(data).forEach(key => {
          if (document.getElementById(key)) {
            document.getElementById(key).value = data[key] || "";
          }
        });
      } catch (err) {
        console.error(err);
        alert("Error loading profile");
      }
    }

    // Toggle Edit Mode
    editBtn.addEventListener("click", () => {
      const inputs = form.querySelectorAll("input");
      inputs.forEach(inp => inp.removeAttribute("readonly"));
      editBtn.classList.add("d-none");
      saveBtn.classList.remove("d-none");
      cancelBtn.classList.remove("d-none");
    });

    // Cancel edit
    cancelBtn.addEventListener("click", () => {
      const inputs = form.querySelectorAll("input");
      inputs.forEach(inp => inp.setAttribute("readonly", true));
      editBtn.classList.remove("d-none");
      saveBtn.classList.add("d-none");
      cancelBtn.classList.add("d-none");
      loadUserProfile(); // reset to original
    });

    // Save changes
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const updatedData = {};
      form.querySelectorAll("input").forEach(inp => {
        updatedData[inp.id] = inp.value.trim();
      });

      try {
        const res = await fetch(`/api/user/profile/update/${userId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedData)
        });

        if (!res.ok) throw new Error("Update failed");
        alert("Profile updated successfully!");

        // Switch back to view mode
        cancelBtn.click();
      } catch (err) {
        console.error(err);
        alert("Error saving changes");
      }
    });

    // Load on startup
    window.onload = loadUserProfile;
</script>
</body>
</html>
