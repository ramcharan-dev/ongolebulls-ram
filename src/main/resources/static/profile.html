<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Ongole Bulls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; background: #f4f6f9; color: #222; min-height: 100vh; }
    .sidebar { width: 220px; background: linear-gradient(135deg, #06142e 80%, #00e3e3 100%); color: #fff; padding: 2rem 1rem 1rem 1rem; height: 100vh; position: fixed; top: 0; left: 0; box-shadow: 2px 0 8px rgba(0,0,0,0.04); z-index: 10; transition: width 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar h2 { color: #00e3e3; text-align: center; margin-bottom: 2rem; letter-spacing: 2px; font-size: 1.6rem; }
    .sidebar a { display: block; padding: 0.8rem 1rem; color: #fff; text-decoration: none; margin-bottom: 0.5rem; border-radius: 5px; font-weight: 500; transition: background 0.2s, color 0.2s, transform 0.2s; }
    .sidebar a:hover, .sidebar .active { background: #0b2547; color: #00e3e3; transform: translateX(5px) scale(1.03); }
    .sidebar .nav-links { flex: 1; }
    .logout-btn { margin-top: 1.5rem; background: #f44336; color: #fff; border: none; border-radius: 5px; padding: 0.8rem 1rem; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.7rem; justify-content: center; transition: background 0.2s; }
    .logout-btn:hover { background: #b71c1c; color: #fff; }
    .logout-btn i { font-size: 1.1rem; }
    .main { margin-left: 220px; flex: 1; padding: 2.5rem 2rem 2rem 2rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .profile-header { font-size: 2rem; color: #06142e; font-weight: 700; margin-bottom: 1.5rem; }
    .profile-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2.5rem 2rem 2rem 2rem; display: flex; flex-direction: column; align-items: center; max-width: 400px; width: 100%; margin-top: 2rem; position: relative; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #00e3e3 60%, #1976d2 100%); display: flex; align-items: center; justify-content: center; font-size: 2.8rem; color: #fff; margin-bottom: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.10); }
    .profile-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; color: #1976d2; }
    .profile-email, .profile-phone { font-size: 1.05rem; color: #555; margin-bottom: 0.2rem; }
    .kyc-status { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 1.05rem; }
    .kyc-badge { background: #00e676; color: #fff; border-radius: 12px; padding: 0.2rem 0.8rem; font-size: 0.98rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem; }
    .kyc-badge i { font-size: 1.1rem; }
    .edit-btn, .save-btn, .cancel-btn { position: absolute; top: 1.2rem; right: 1.2rem; background: #1976d2; color: #fff; border: none; border-radius: 6px; padding: 0.4rem 1.1rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .edit-btn:hover, .save-btn:hover { background: #00e3e3; color: #06142e; }
    .save-btn, .cancel-btn { right: auto; left: 1.2rem; margin-right: 0.5rem; }
    .cancel-btn { left: auto; right: 1.2rem; background: #f57c00; color: #fff; }
    .cancel-btn:hover { background: #ffc107; color: #222; }
    .profile-input { font-size: 1.05rem; padding: 0.2rem 0.5rem; border: 1px solid #bbb; border-radius: 5px; margin-bottom: 0.2rem; width: 90%; }
    @media (max-width: 768px) { .sidebar { position: relative; width: 100%; height: auto; display: flex; flex-direction: row; justify-content: space-around; padding: 1rem 0.5rem; box-shadow: none; } .sidebar h2 { display: none; } .sidebar a { margin-bottom: 0; padding: 0.7rem 0.8rem; font-size: 1rem; } .main { margin-left: 0; padding: 1.2rem 0.5rem 2.5rem 0.5rem; } footer { font-size: 0.95rem; } }
    @media (max-width: 500px) { .main { padding: 0.7rem 0.2rem 2.5rem 0.2rem; } .sidebar a { font-size: 0.95rem; padding: 0.6rem 0.5rem; } .profile-card { padding: 1.2rem 0.5rem; } }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
<div class="sidebar">
  <div>
    <h2>Ongolebulls</h2>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="sipp.html">SIPs</a>
      <a href="profile.html" class="active">Profile</a>
    </div>
  </div>
  <button class="logout-btn" onclick="alert('You have been logged out!')"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>
<div class="main">
  <div class="profile-header">Your Profile</div>
  <div class="profile-card" id="profileCard">
    <button class="edit-btn" id="editBtn"><i class="fas fa-edit"></i> Edit</button>
    <div class="avatar"><i class="fas fa-user"></i></div>
    <div class="profile-name" id="profileName">Utkarsh Garad</div>
    <div class="profile-email" id="profileEmail"><i class="fas fa-envelope"></i> utkarsh@example.com</div>
    <div class="profile-phone" id="profilePhone"><i class="fas fa-phone"></i> +91-XXXXXXXXXX</div>
    <div class="kyc-status">
      <span>KYC Status:</span>
      <span class="kyc-badge"><i class="fas fa-check-circle"></i> Verified</span>
    </div>
  </div>
</div>
<footer>
  &copy; 2024 Ongole Bulls. All rights reserved.
</footer>
<script>
  const profileCard = document.getElementById('profileCard');
  const editBtn = document.getElementById('editBtn');
  let editing = false;
  let original = {
    name: document.getElementById('profileName').textContent,
    email: document.getElementById('profileEmail').textContent.replace(/^[^\s]+\s/, ''),
    phone: document.getElementById('profilePhone').textContent.replace(/^[^\s]+\s/, '')
  };
  function renderEdit() {
    profileCard.innerHTML = `
      <button class="save-btn" id="saveBtn"><i class="fas fa-save"></i> Save</button>
      <button class="cancel-btn" id="cancelBtn"><i class="fas fa-times"></i> Cancel</button>
      <div class="avatar"><i class="fas fa-user"></i></div>
      <input class="profile-input" id="inputName" value="${original.name}" />
      <input class="profile-input" id="inputEmail" value="${original.email}" />
      <input class="profile-input" id="inputPhone" value="${original.phone}" />
      <div class="kyc-status">
        <span>KYC Status:</span>
        <span class="kyc-badge"><i class="fas fa-check-circle"></i> Verified</span>
      </div>
    `;
    document.getElementById('saveBtn').onclick = saveEdit;
    document.getElementById('cancelBtn').onclick = cancelEdit;
  }
  function saveEdit() {
    original.name = document.getElementById('inputName').value;
    original.email = document.getElementById('inputEmail').value;
    original.phone = document.getElementById('inputPhone').value;
    renderView();
  }
  function cancelEdit() {
    renderView();
  }
  function renderView() {
    profileCard.innerHTML = `
      <button class="edit-btn" id="editBtn"><i class="fas fa-edit"></i> Edit</button>
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="profile-name" id="profileName">${original.name}</div>
      <div class="profile-email" id="profileEmail"><i class="fas fa-envelope"></i> ${original.email}</div>
      <div class="profile-phone" id="profilePhone"><i class="fas fa-phone"></i> ${original.phone}</div>
      <div class="kyc-status">
        <span>KYC Status:</span>
        <span class="kyc-badge"><i class="fas fa-check-circle"></i> Verified</span>
      </div>
    `;
    document.getElementById('editBtn').onclick = renderEdit;
  }
  editBtn.onclick = renderEdit;
</script>
</body>
</html>
