<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Ongole Bulls Invest</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="/common.js" defer></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0d263a 0%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .unsubscribe-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 48px;
            text-align: center;
        }

        .unsubscribe-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, rgba(189, 42, 31, 0.1) 0%, rgba(187, 146, 54, 0.1) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #bd2a1f;
        }

        .unsubscribe-icon.success {
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.1) 0%, rgba(25, 135, 84, 0.1) 100%);
            color: #28a745;
        }

        .unsubscribe-icon.error {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.1) 0%, rgba(178, 34, 34, 0.1) 100%);
            color: #dc3545;
        }

        .unsubscribe-icon.loading {
            background: linear-gradient(135deg, rgba(13, 38, 58, 0.1) 0%, rgba(26, 58, 82, 0.1) 100%);
            color: #0d263a;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #0d263a;
            margin-bottom: 16px;
        }

        .message {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .message.success {
            color: #28a745;
        }

        .message.error {
            color: #dc3545;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 24px;
            background: #bd2a1f;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #9a2219;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(189, 42, 31, 0.3);
            color: #fff;
        }

        .loading-text {
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <!-- Common Header -->
    <div id="header-container"></div>

    <div class="unsubscribe-container">
        <div class="unsubscribe-icon loading" id="statusIcon">
            <i class="bi bi-hourglass-split"></i>
        </div>
        <h1 id="statusTitle">Processing Unsubscribe Request</h1>
        <p class="message loading-text" id="statusMessage">Please wait while we process your request...</p>
        <a href="/" class="back-link" id="backLink" style="display: none;">
            <i class="bi bi-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Common Footer -->
    <div id="footer-container"></div>

    <script src="/unsubscribe.js"></script>
</body>
</html>
