<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scheme List with Filters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
          padding: 20px;
        }
        .filter-section h6 {
          cursor: pointer;
        }
        .scheme-item {
          border-bottom: 1px solid #ddd;
          padding: 15px 0;
        }
        .scheme-item:last-child {
          border-bottom: none;
        }
        .risk-badge {
          font-weight: 600;
          padding: 0.25em 0.5em;
          border-radius: 0.25rem;
          color: white;
          font-size: 0.8rem;
          user-select: none;
        }
        .risk-very-high {
          background-color: #dc3545; /* Bootstrap danger */
        }
        .risk-high {
          background-color: #fd7e14; /* Bootstrap warning */
        }
        .risk-moderate {
          background-color: #ffc107; /* Bootstrap yellow */
          color: black;
        }
        .risk-low {
          background-color: #198754; /* Bootstrap success */
        }
        .scheme-tag {
          font-size: 0.75rem;
          background: #e9ecef;
          border-radius: 3px;
          padding: 2px 6px;
          margin-left: 6px;
          font-weight: 600;
        }
        .info-icon {
          font-size: 0.9rem;
          color: #6c757d;
          margin-left: 5px;
          cursor: pointer;
        }
        .sort-return-btns button.active {
          background-color: #0d6efd;
          color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row gx-4">
        <!-- Left Filter Sidebar -->
        <div class="col-md-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Filters</h5>
                <button id="resetFilters" class="btn btn-link p-0">Reset</button>
            </div>

            <div id="filtersContainer"></div>
        </div>

        <!-- Right Content -->
        <div class="col-md-9">
            <!-- Top controls: Search + Returns + Sort -->
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <form class="d-flex flex-grow-1 me-3" id="searchForm">
                    <input id="searchInput" class="form-control" type="search" placeholder="Search for a scheme here.." aria-label="Search" />
                    <button class="btn btn-primary ms-2" type="submit"><i class="bi bi-search"></i> Search</button>
                </form>

                <div class="sort-return-btns d-flex align-items-center gap-2 flex-wrap">
                    <div class="btn-group" role="group" aria-label="Returns filter">
                        <button type="button" class="btn btn-outline-primary" data-return="1Y">1Y</button>
                        <button type="button" class="btn btn-outline-primary" data-return="3Y">3Y</button>
                        <button type="button" class="btn btn-outline-primary" data-return="5Y">5Y</button>
                        <button type="button" class="btn btn-primary active" data-return="Since Inception">Since Inception</button>
                    </div>

                    <div class="dropdown ms-3">
                        <a class="btn btn-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Sort by <strong id="currentSort">Highest Returns</strong>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item sort-option" href="#" data-sort="highest">Highest Returns</a></li>
                            <li><a class="dropdown-item sort-option" href="#" data-sort="lowest">Lowest Returns</a></li>
                            <li><a class="dropdown-item sort-option" href="#" data-sort="newest">Newest First</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Schemes List -->
            <div id="schemesList">
                <!-- dynamically filled -->
            </div>

            <div id="resultsCount" class="mb-3"></div>
        </div>
    </div>
</div>

<!-- Bootstrap & icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

<script>
    // Sample schemes data (simulate DB)
    const schemes = [
      {
        name: "SBI Small Cap Fund",
        type: "Equity",
        returns: { regular: 19.61, direct: 24.24 },
        nav: 167.6622,
        navChangePercent: -0.55,
        fundAgeYears: 15,
        risk: "Very High",
        suitability: "Long-Term Capital Appreciation",
        suitabilityYears: "3 years+"
      },
      {
        name: "SBI Contra Fund",
        type: "Equity",
        returns: { regular: 19.12, direct: 16.73 },
        nav: 371.6289,
        navChangePercent: -0.98,
        fundAgeYears: 26,
        risk: "Very High",
        suitability: "",
        suitabilityYears: "3 years+"
      },
      {
        name: "ICICI Prudential Bluechip Fund",
        type: "Equity",
        returns: { regular: 15.23, direct: 17.89 },
        nav: 140.55,
        navChangePercent: 0.33,
        fundAgeYears: 10,
        risk: "Moderate",
        suitability: "Long-Term Capital Appreciation",
        suitabilityYears: "3 years+"
      },
      {
        name: "HDFC Balanced Advantage Fund",
        type: "Hybrid",
        returns: { regular: 12.47, direct: 13.15 },
        nav: 35.85,
        navChangePercent: 0.12,
        fundAgeYears: 7,
        risk: "Low",
        suitability: "Balanced growth & stability",
        suitabilityYears: ""
      },
      // Add more schemes as needed
    ];

    // Filter data same as before
    const filterData = {
      "Risk Rating": [
        "Low",
        "Low To Moderate",
        "Moderate",
        "Moderately High",
        "High",
        "Very High"
      ],
      "Time Horizon": [
        "Short Term (1 year)",
        "Medium Term (1-3 year)",
        "Long Term (3 years +)"
      ],
      "Goals": [
        "Retirement",
        "Child Education",
        "Long-Term Capital Appreciation",
        "Tax Planning",
        "Surplus Liquidity Parking",
        "Short-Term Parking",
        "Medium-Term Capital Appreciation",
        "Medium to Long Term Capital Appreciation",
        "Income over target maturity period",
        "Capital growth",
        "Income Generation"
      ],
      "Investment Type": [
        "Mutual Funds",
        "Stocks",
        "Bonds",
        "Real Estate",
        "Gold",
        "ETF"
      ]
    };

    // Build dynamic filters UI
    const filtersContainer = document.getElementById("filtersContainer");

    function buildFilters(data) {
      filtersContainer.innerHTML = ""; // Clear previous

      for (const category in data) {
        const catDiv = document.createElement("div");
        catDiv.classList.add("mb-3", "filter-section");

        // Category title with collapse toggle
        const catTitle = document.createElement("h6");
        catTitle.textContent = category;
        catTitle.setAttribute("data-bs-toggle", "collapse");
        catTitle.setAttribute("href", "#" + category.replace(/\s+/g, '') + "Options");
        catTitle.setAttribute("role", "button");
        catTitle.setAttribute("aria-expanded", "true");
        catTitle.setAttribute("aria-controls", category.replace(/\s+/g, '') + "Options");
        catTitle.classList.add("mb-2");
        catTitle.style.userSelect = "none";
        catDiv.appendChild(catTitle);

        // Options container with Bootstrap collapse
        const optionsDiv = document.createElement("div");
        optionsDiv.id = category.replace(/\s+/g, '') + "Options";
        optionsDiv.classList.add("collapse", "show");

        data[category].forEach((option, i) => {
          const optionId = category.toLowerCase().replace(/\s+/g, '-') + '-' + i;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = optionId;
          checkbox.name = category;
          checkbox.value = option;
          checkbox.classList.add("form-check-input");

          const label = document.createElement("label");
          label.htmlFor = optionId;
          label.classList.add("form-check-label");
          label.textContent = option;

          const wrapper = document.createElement("div");
          wrapper.classList.add("form-check");

          wrapper.appendChild(checkbox);
          wrapper.appendChild(label);
          optionsDiv.appendChild(wrapper);
        });

        catDiv.appendChild(optionsDiv);
        filtersContainer.appendChild(catDiv);
      }
    }

    buildFilters(filterData);

    // Reset button
    document.getElementById("resetFilters").addEventListener("click", () => {
      const checkboxes = filtersContainer.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
      applyFilters();
    });

    // Search form submit
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      applyFilters();
    });

    // Handle sort dropdown
    const sortOptions = document.querySelectorAll(".sort-option");
    const currentSortEl = document.getElementById("currentSort");
    let currentSort = "highest";

    sortOptions.forEach(opt => {
      opt.addEventListener("click", (e) => {
        e.preventDefault();
        currentSort = opt.dataset.sort;
        currentSortEl.textContent = opt.textContent;
        applyFilters();
      });
    });

    // Handle returns buttons toggle
    const returnButtons = document.querySelectorAll('.btn-group button');
    let currentReturn = "Since Inception";

    returnButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        returnButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentReturn = btn.dataset.return;
        applyFilters();
      });
    });

    // Apply filters & display schemes
    function applyFilters() {
      const selectedFilters = getSelectedFilters();
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();

      // Filter schemes by search & filters
      let filteredSchemes = schemes.filter(scheme => {
        // Search filter
        if (!scheme.name.toLowerCase().includes(searchTerm)) return false;

        // Risk Rating filter
        if (selectedFilters["Risk Rating"].length > 0 && !selectedFilters["Risk Rating"].includes(scheme.risk)) return false;

        // Time Horizon filter (simplified check)
        if (selectedFilters["Time Horizon"].length > 0) {
          let matchedTime = false;
          for (const th of selectedFilters["Time Horizon"]) {
            if (th.includes("Short") && scheme.fundAgeYears <= 1) matchedTime = true;
            else if (th.includes("Medium") && scheme.fundAgeYears > 1 && scheme.fundAgeYears <= 3) matchedTime = true;
            else if (th.includes("Long") && scheme.fundAgeYears > 3) matchedTime = true;
          }
          if (!matchedTime) return false;
        }

        // Goals filter (checking suitability string)
        if (selectedFilters["Goals"].length > 0) {
          let matchedGoal = false;
          for (const goal of selectedFilters["Goals"]) {
            if (scheme.suitability.toLowerCase().includes(goal.toLowerCase())) matchedGoal = true;
          }
          if (!matchedGoal) return false;
        }

        // Investment Type filter - dummy check here (you can add real data to scheme)
        if (selectedFilters["Investment Type"].length > 0) {
          // For demo, skip filtering here or add your own logic based on scheme data
        }

        return true;
      });

      // Sort filteredSchemes by currentSort and currentReturn
      filteredSchemes.sort((a, b) => {
        // Sort by Returns Regular or Direct based on currentReturn (For demo, only "Since Inception" implemented)
        // You can extend logic to pick 1Y, 3Y, 5Y returns if you have data
        const valA = a.returns.direct; // always direct returns for demo
        const valB = b.returns.direct;

        if (currentSort === "highest") return valB - valA;
        else if (currentSort === "lowest") return valA - valB;
        else return b.fundAgeYears - a.fundAgeYears; // newest first - here interpreted as older first (demo)
      });

      renderSchemes(filteredSchemes);
    }

    // Render schemes list
    const schemesList = document.getElementById("schemesList");
    const resultsCount = document.getElementById("resultsCount");

    function renderSchemes(schemesToRender) {
      schemesList.innerHTML = "";
      resultsCount.textContent = `${schemesToRender.length} schemes found`;

      schemesToRender.forEach(scheme => {
        const schemeDiv = document.createElement("div");
        schemeDiv.classList.add("scheme-item");

        // Risk badge color class
        let riskClass = "risk-low";
        if (scheme.risk.toLowerCase() === "very high") riskClass = "risk-very-high";
        else if (scheme.risk.toLowerCase() === "high") riskClass = "risk-high";
        else if (scheme.risk.toLowerCase() === "moderate") riskClass = "risk-moderate";

        schemeDiv.innerHTML = `
          <h5>
            <a href="#" class="text-primary">${scheme.name}</a>
            <span class="scheme-tag">${scheme.type}</span>
            <i class="bi bi-info-circle info-icon" title="Scheme info"></i>
          </h5>
          <div class="d-flex flex-wrap gap-3 mt-2">
            <div>Returns: <span class="text-success">${scheme.returns.regular.toFixed(2)}%</span> Regular-Growth</div>
            <div>Returns: <span class="text-success">${scheme.returns.direct.toFixed(2)}%</span> Direct-Growth</div>
            <div>NAV (As on ${new Date().toLocaleDateString()}): ₹${scheme.nav.toFixed(4)} <span class="${scheme.navChangePercent >= 0 ? 'text-success' : 'text-danger'}">${scheme.navChangePercent >= 0 ? '↑' : '↓'} ${Math.abs(scheme.navChangePercent).toFixed(2)}%</span></div>
            <div>Fund Age: ${scheme.fundAgeYears} Years</div>
            <div>Risk: <span class="risk-badge ${riskClass}">${scheme.risk.toUpperCase()}</span></div>
          </div>
          <div class="mt-2 text-muted small">
            Suitable for: ${scheme.suitability} ${scheme.suitabilityYears ? `· (${scheme.suitabilityYears})` : ""}
          </div>
          <div class="mt-3 d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-primary btn-sm">View Details</button>
            <button class="btn btn-primary btn-sm">Invest</button>
            <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-bookmark"></i></button>
          </div>
        `;

        schemesList.appendChild(schemeDiv);
      });
    }

    // Get selected filters helper
    function getSelectedFilters() {
      const selected = {};
      for (const category in filterData) {
        selected[category] = [];
        const checkboxes = filtersContainer.querySelectorAll(`input[name="${category}"]:checked`);
        checkboxes.forEach(cb => selected[category].push(cb.value));
      }
      return selected;
    }

    // Initial render
    applyFilters();
</script>
</body>
</html>
