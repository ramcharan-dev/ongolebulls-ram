        <div class="duration-wrap">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/calculator';

    // State
    let activeTab = 'sip';
    let years = 5;
    let unit = 'years';
    let customOpen = false;

    // Elements
    const sipTab = document.getElementById('sip-tab');
    const lumpTab = document.getElementById('lump-tab');
    const sipSection = document.getElementById('sipSection');
    const lumpSection = document.getElementById('lumpSection');

    const durationButtons = document.getElementById('durationButtons');
    const customPanel = document.getElementById('customPanel');
    const customBtn = document.getElementById('customBtn');
    const segYears  = document.getElementById('segYears');
    const segMonths = document.getElementById('segMonths');
    const durationValue = document.getElementById('durationValue');
    const durationSuffix = document.getElementById('durationSuffix');

    const sipAmount = document.getElementById('sip-amount');
    const sipAmountText = document.getElementById('sipAmountText');
    const lumpAmount = document.getElementById('lump-amount');
    const lumpAmountText = document.getElementById('lumpAmountText');
    const annualRate = document.getElementById('annual-rate');
    const annualRateText = document.getElementById('annualRateText');

    function formatINR(value) { return '₹' + Number(value).toLocaleString('en-IN'); }
    function setActiveIn(container, btn) { container.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    // Tabs
    sipTab.onclick = () => setActiveTab('sip');
    lumpTab.onclick = () => setActiveTab('lumpsum');

    function setActiveTab(tab) {
      activeTab = tab;
      if (tab === 'sip') {
        sipTab.classList.add('active'); lumpTab.classList.remove('active');
        sipSection.classList.add('show'); lumpSection.classList.remove('show');
      } else {
        lumpTab.classList.add('active'); sipTab.classList.remove('active');
        lumpSection.classList.add('show'); sipSection.classList.remove('show');
      }
      updateCalc();
    }

    // Duration quick selects
    function setQuickYears(y, btn) {
      years = Number(y);
      setActiveIn(durationButtons, btn);
      closeCustomPanel();
      updateCalc();
    }

    function toggleCustom(btn) {
      customOpen = !customOpen;
      if (customOpen) {
        setActiveIn(durationButtons, btn);
        openCustomPanel();
      } else {
        btn.classList.remove('active');
        updateCalc();
      }
    }

    function openCustomPanel() {
      customPanel.style.display = 'block';
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50;
      durationValue.value = clamp(Math.round(years || 5), 1, 50);
    }

    function closeCustomPanel() {
      customOpen = false;
      customPanel.style.display = 'none';
      customBtn.classList.remove('active');
    }

    // Custom segmented logic
    segYears.addEventListener('click', () => {
      if (unit === 'years') return;
      const m = parseInt(durationValue.value || '0', 10);
      const toYears = m ? m / 12 : (years || 5);
      years = Math.round(toYears * 100) / 100;
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50;
      durationValue.value = clamp(Math.round(years), 1, 50);
      updateCalc();
    });

    segMonths.addEventListener('click', () => {
      if (unit === 'months') return;
      const yVal = parseFloat(durationValue.value || years || 5);
      const toMonths = Math.round((yVal || 5) * 12);
      unit = 'months';
      segMonths.classList.add('active'); segYears.classList.remove('active');
      durationSuffix.textContent = 'M';
      durationValue.min = 1; durationValue.max = 600;
      durationValue.value = clamp(toMonths, 1, 600);
      years = Math.round((Number(durationValue.value) / 12) * 100) / 100;
      updateCalc();
    });

    durationValue.addEventListener('input', () => {
      let v = parseInt(durationValue.value || '0', 10);
      if (!Number.isFinite(v)) return;
      if (unit === 'years') {
        v = clamp(v, 1, 50); durationValue.value = v; years = v;
      } else {
        v = clamp(v, 1, 600); durationValue.value = v; years = Math.round((v / 12) * 100) / 100;
      }
      updateCalc();
    });

    document.getElementById('clearDuration').addEventListener('click', () => {
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50; durationValue.value = 5;
      years = 5;
      updateCalc();
    });

    // AMC/Schemes
    async function loadAMCs() {
      const res = await fetch(`${BASE_URL}/amcs`, { method: 'GET' });
      const data = await res.json();
      const amcDropdown = document.getElementById('amcDropdown');
      amcDropdown.innerHTML = '<option value="">Select AMC</option>';
      data.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name;
        amcDropdown.appendChild(opt);
      });
    }

    async function loadSchemes() {
      const amcId = document.getElementById('amcDropdown').value;
      const schemeDropdown = document.getElementById('schemeDropdown');
      if (!amcId) {
        schemeDropdown.innerHTML = '<option value="">Select Scheme</option>';
        return;
      }
      const res = await fetch(`${BASE_URL}/schemes/${amcId}`, { method: 'GET' });
      const data = await res.json();
      schemeDropdown.innerHTML = '<option value="">Select Scheme</option>';
      data.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.avgReturnRate;
        opt.textContent = s.name;
        schemeDropdown.appendChild(opt);
      });
    }

    function setSchemeRate() {
      const rate = document.getElementById('schemeDropdown').value;
      if (rate) {
        annualRate.value = rate;
        annualRateText.textContent = rate + '%';
        updateCalc();
      }
    }

    // Donut chart with brand colors
    let donut;
    const centerText = {
      id: 'centerText',
      afterDraw(chart, args, pluginOptions) {
        const total = pluginOptions.total || 0;
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data || !meta.data[0]) return;
        const {x, y} = meta.data[0];
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '700 18px Inter, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Total', x, y - 12);
        ctx.font = '800 20px Inter, sans-serif';
        ctx.fillStyle = '#ffffff'; // white
        ctx.fillText('₹' + Number(total).toLocaleString('en-IN'), x, y + 12);
        ctx.restore();
      }
    };

    function initDonut() {
      const ctx = document.getElementById('resultDonut');
      if (!ctx) return;
      donut = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Invested Amount', 'Est.Returns'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['rgb(13,38,58)', 'rgb(189,42,31)'], // blue for invested, red for returns
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: {
              display: true, position: 'bottom',
              labels: { usePointStyle: true, color: '#ffffff', boxWidth: 10 }
            }
          }
        },
        plugins: [centerText]
      });
    }

    function updateDonut(investedAmount, estimatedReturns, totalAmount) {
      if (!donut) initDonut();
      donut.data.datasets[0].data = [
        Math.max(0, Number(investedAmount || 0)),
        Math.max(0, Number(estimatedReturns || 0))
      ];
      donut.options.plugins.centerText = { total: totalAmount };
      donut.update();
    }

    // Unified calculation
    async function updateCalc() {
      sipAmountText.textContent = formatINR(Number(sipAmount.value));
      lumpAmountText.textContent = formatINR(Number(lumpAmount.value));
      annualRateText.textContent = Number(annualRate.value) + '%';

      const R = Number(annualRate.value);
      const url = activeTab === 'sip'
        ? `${BASE_URL}/sip?monthlyInvestment=${Number(sipAmount.value)}&annualReturn=${R}&years=${years}`
        : `${BASE_URL}/lumpsum?amount=${Number(lumpAmount.value)}&annualReturn=${R}&years=${years}`;

      const res = await fetch(url, { method: 'GET' });
      const data = await res.json();

      document.getElementById('totalAmount').textContent = formatINR(Math.round(data.maturityValue));
      document.getElementById('returns').textContent = formatINR(Math.round(data.estimatedReturns));

      const investedAmount = activeTab === 'sip'
        ? Number(sipAmount.value) * Math.round(years * 12)
        : Number(lumpAmount.value);

      updateDonut(investedAmount, data.estimatedReturns, data.maturityValue);
    }

    // Init
    setActiveTab('sip');
    loadAMCs();
    initDonut();
    updateCalc();
</script>
</body>
</html>
-->

<body>
<!-- Common Header -->
<div id="header-container"></div>
<div class="calculator-container">
    <div class="left-panel">
        <h1>Mutual Fund Calculator</h1>

        <!-- AMC and Scheme -->
        <select id="amcDropdown" onchange="loadSchemes()">
            <option value="">Select AMC</option>
        </select>
        <select id="schemeDropdown" onchange="setSchemeRate()">
            <option value="">Select Scheme</option>
        </select>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" id="sip-tab">SIP</div>
            <div class="tab" id="lump-tab">Lumpsum</div>
        </div>

        <!-- SIP Monthly Amount (numeric) -->
        <div class="sip-only show" id="sipSection">
            <div class="field">
                <label>Monthly Investment (₹)</label>
                <input type="number" id="sip-amount" min="500" step="100" value="5000" placeholder="Enter amount" oninput="sanitizeAmount(this); updateCalc();">
                <div class="note-text">Min: ₹500</div>
                <div class="output-row"><span class="chip">You entered:</span> <span id="sipAmountText">₹5,000</span></div>
            </div>
        </div>

        <!-- Lumpsum Amount (numeric) -->
        <div class="lumpsum-only" id="lumpSection">
            <div class="field">
                <label>Lumpsum Amount (₹)</label>
                <input type="number" id="lump-amount" min="1000" step="1000" value="100000" placeholder="Enter amount" oninput="sanitizeAmount(this); updateCalc();">
                <div class="note-text">Min: ₹1,000</div>
                <div class="output-row"><span class="chip">You entered:</span> <span id="lumpAmountText">₹1,00,000</span></div>
            </div>
        </div>

        <!-- Expected Annual Return -->
        <div class="field">
            <label>Expected Annual Return (%)</label>
            <input type="number" id="annual-rate" min="1" max="50" step="0.1" value="12" placeholder="e.g. 12" oninput="clampRate(); updateCalc();">
            <div class="note-text">Range: 1%–50%</div>
            <div class="output-row"><span class="chip">Current:</span> <span id="annualRateText">12%</span></div>
        </div>

        <!-- Duration quick-select + Custom -->
        <div class="duration-wrap">
            <label class="duration-label">Duration</label>
            <div class="duration-buttons" id="durationButtons">
                <button onclick="setQuickYears(1, this)">1 Year</button>
                <button onclick="setQuickYears(3, this)">3 Years</button>
                <button onclick="setQuickYears(5, this)" class="active">5 Years</button>
                <button onclick="toggleCustom(this)" id="customBtn">Custom</button>
            </div>

            <div class="custom-panel" id="customPanel">
                <div class="duration-segment">
                    <button type="button" class="seg-btn active" id="segYears">Years</button>
                    <button type="button" class="seg-btn" id="segMonths">Months</button>

                    <div class="duration-input">
                        <input type="number" id="durationValue" inputmode="numeric" min="1" max="50" step="1" placeholder="e.g. 5" />
                        <span id="durationSuffix">Y</span>
                        <span class="hint">Max 600 months</span>
                        <button type="button" class="clear-x" id="clearDuration" aria-label="Clear">✕</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel" id="results">
        <div>
            <h2 style="color:#fff;">Total Amount</h2>
            <div class="amount" id="totalAmount">₹0</div>
            <div>Estimated Returns: <strong id="returns">₹0</strong></div>
        </div>
        <div class="donut-wrap">
            <canvas id="resultDonut"></canvas>
        </div>
        <button class="invest-btn">INVEST NOW</button>
    </div>
</div>

<!-- Common Footer -->
<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/calculator';

    // State
    let activeTab = 'sip';
    let years = 5;
    let unit = 'years';
    let customOpen = false;

    // Elements
    const sipTab = document.getElementById('sip-tab');
    const lumpTab = document.getElementById('lump-tab');
    const sipSection = document.getElementById('sipSection');
    const lumpSection = document.getElementById('lumpSection');

    const durationButtons = document.getElementById('durationButtons');
    const customPanel = document.getElementById('customPanel');
    const customBtn = document.getElementById('customBtn');
    const segYears  = document.getElementById('segYears');
    const segMonths = document.getElementById('segMonths');
    const durationValue = document.getElementById('durationValue');
    const durationSuffix = document.getElementById('durationSuffix');

    const sipAmount = document.getElementById('sip-amount');
    const sipAmountText = document.getElementById('sipAmountText');
    const lumpAmount = document.getElementById('lump-amount');
    const lumpAmountText = document.getElementById('lumpAmountText');
    const annualRate = document.getElementById('annual-rate');
    const annualRateText = document.getElementById('annualRateText');

    function formatINR(value) { return '₹' + Number(value || 0).toLocaleString('en-IN'); }
    function setActiveIn(container, btn) { container.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function sanitizeAmount(inp){ const v = Number(inp.value || 0); if (v < 0) inp.value = 0; }
    function clampRate(){ annualRate.value = clamp(Number(annualRate.value || 0), 1, 50); }

    // Tabs
    sipTab.onclick = () => setActiveTab('sip');
    lumpTab.onclick = () => setActiveTab('lumpsum');
    function setActiveTab(tab) {
      activeTab = tab;
      if (tab === 'sip') {
        sipTab.classList.add('active'); lumpTab.classList.remove('active');
        sipSection.classList.add('show'); lumpSection.classList.remove('show');
      } else {
        lumpTab.classList.add('active'); sipTab.classList.remove('active');
        lumpSection.classList.add('show'); sipSection.classList.remove('show');
      }
      updateCalc();
    }

    // Duration quick selects
    function setQuickYears(y, btn) {
      years = Number(y);
      setActiveIn(durationButtons, btn);
      closeCustomPanel();
      updateCalc();
    }
    function toggleCustom(btn) {
      customOpen = !customOpen;
      if (customOpen) {
        setActiveIn(durationButtons, btn);
        openCustomPanel();
      } else {
        btn.classList.remove('active');
        updateCalc();
      }
    }
    function openCustomPanel() {
      customPanel.style.display = 'block';
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50;
      durationValue.value = clamp(Math.round(years || 5), 1, 50);
    }
    function closeCustomPanel() {
      customOpen = false;
      customPanel.style.display = 'none';
      customBtn.classList.remove('active');
    }

    // Custom segmented logic
    segYears.addEventListener('click', () => {
      if (unit === 'years') return;
      const m = parseInt(durationValue.value || '0', 10);
      const toYears = m ? m / 12 : (years || 5);
      years = Math.round(toYears * 100) / 100;
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50;
      durationValue.value = clamp(Math.round(years), 1, 50);
      updateCalc();
    });
    segMonths.addEventListener('click', () => {
      if (unit === 'months') return;
      const yVal = parseFloat(durationValue.value || years || 5);
      const toMonths = Math.round((yVal || 5) * 12);
      unit = 'months';
      segMonths.classList.add('active'); segYears.classList.remove('active');
      durationSuffix.textContent = 'M';
      durationValue.min = 1; durationValue.max = 600;
      durationValue.value = clamp(toMonths, 1, 600);
      years = Math.round((Number(durationValue.value) / 12) * 100) / 100;
      updateCalc();
    });
    durationValue.addEventListener('input', () => {
      let v = parseInt(durationValue.value || '0', 10);
      if (!Number.isFinite(v)) return;
      if (unit === 'years') {
        v = clamp(v, 1, 50); durationValue.value = v; years = v;
      } else {
        v = clamp(v, 1, 600); durationValue.value = v; years = Math.round((v / 12) * 100) / 100;
      }
      updateCalc();
    });
    document.getElementById('clearDuration').addEventListener('click', () => {
      unit = 'years';
      segYears.classList.add('active'); segMonths.classList.remove('active');
      durationSuffix.textContent = 'Y';
      durationValue.min = 1; durationValue.max = 50; durationValue.value = 5;
      years = 5;
      updateCalc();
    });

    // AMC/Schemes
    async function loadAMCs() {
      const res = await fetch(`${BASE_URL}/amcs`);
      const data = await res.json();
      const amcDropdown = document.getElementById('amcDropdown');
      amcDropdown.innerHTML = '<option value="">Select AMC</option>';
      data.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name;
        amcDropdown.appendChild(opt);
      });
    }
    async function loadSchemes() {
      const amcId = document.getElementById('amcDropdown').value;
      const schemeDropdown = document.getElementById('schemeDropdown');
      if (!amcId) { schemeDropdown.innerHTML = '<option value="">Select Scheme</option>'; return; }
      const res = await fetch(`${BASE_URL}/schemes/${amcId}`);
      const data = await res.json();
      schemeDropdown.innerHTML = '<option value="">Select Scheme</option>';
      data.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.avgReturnRate;
        opt.textContent = s.name;
        schemeDropdown.appendChild(opt);
      });
    }
    function setSchemeRate() {
      const rate = document.getElementById('schemeDropdown').value;
      if (rate) {
        annualRate.value = rate;
        annualRateText.textContent = rate + '%';
        updateCalc();
      }
    }

    // Donut chart with brand colors
    let donut;
    const centerText = {
      id: 'centerText',
      afterDraw(chart) {
        const total = chart?.options?.plugins?.centerText?.total || 0;
        const meta0 = chart.getDatasetMeta(0);
        if (!meta0 || !meta0.data || !meta0.data[0]) return;
        const {x, y} = meta0.data[0];
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '700 18px Inter, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Total', x, y - 12);
        ctx.font = '800 20px Inter, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('₹' + Number(total).toLocaleString('en-IN'), x, y + 12);
        ctx.restore();
      }
    };
    function initDonut() {
      const ctx = document.getElementById('resultDonut');
      if (!ctx) return;
      donut = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Invested Amount', 'Est.Returns'],
          datasets: [{ data: [0, 0], backgroundColor: ['rgb(13,38,58)', 'rgb(189,42,31)'], borderWidth: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: { display: true, position: 'bottom', labels: { usePointStyle: true, color: '#ffffff', boxWidth: 10 } },
            centerText: { total: 0 }
          }
        },
        plugins: [centerText]
      });
    }
    function updateDonut(investedAmount, estimatedReturns, totalAmount) {
      if (!donut) initDonut();
      donut.data.datasets[0].data = [
        Math.max(0, Number(investedAmount || 0)),
        Math.max(0, Number(estimatedReturns || 0))
      ];
      donut.options.plugins.centerText = { total: totalAmount };
      donut.update();
    }

    // Unified calculation
    async function updateCalc() {
      sipAmountText.textContent = formatINR(Number(sipAmount.value));
      lumpAmountText.textContent = formatINR(Number(lumpAmount.value));
      annualRateText.textContent = Number(annualRate.value) + '%';

      const R = Number(annualRate.value || 0);
      const url = activeTab === 'sip'
        ? `${BASE_URL}/sip?monthlyInvestment=${Number(sipAmount.value || 0)}&annualReturn=${R}&years=${years}`
        : `${BASE_URL}/lumpsum?amount=${Number(lumpAmount.value || 0)}&annualReturn=${R}&years=${years}`;

      const res = await fetch(url);
      const data = await res.json();

      document.getElementById('totalAmount').textContent = formatINR(Math.round(data.maturityValue));
      document.getElementById('returns').textContent = formatINR(Math.round(data.estimatedReturns));

      const investedAmount = activeTab === 'sip'
        ? Number(sipAmount.value || 0) * Math.round(years * 12)
        : Number(lumpAmount.value || 0);

      updateDonut(investedAmount, data.estimatedReturns, data.maturityValue);
    }

    // Init
    loadAMCs();
    initDonut();
    setActiveTab('sip'); // triggers updateCalc
</script>
</body>
</html>
