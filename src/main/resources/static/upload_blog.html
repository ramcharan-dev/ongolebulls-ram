<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Upload New Blog</h2>

    <form th:action="@{/api/blogs/admin/blog/save}" th:object="${blog}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label for="shortDescription" class="form-label">Short Description</label>
            <textarea th:field="*{shortDescription}" class="form-control" id="shortDescription" rows="2" required></textarea>
        </div>

        <div class="mb-3">
            <label for="fullContent" class="form-label">Full Content</label>
            <textarea th:field="*{fullContent}" class="form-control" id="fullContent" rows="8" required></textarea>
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">Author</label>
            <input type="text" th:field="*{author}" class="form-control" id="author" required>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Upload Image</label>
            <input type="file" name="imageFile" class="form-control" id="imageFile" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">Upload Blog</button>
    </form>
</div>
</body>
</html>
