<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="/common.js" defer></script> <!-- Load JavaScript -->


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            display: flex;
            gap: 10px;
            padding: 20px;
        }
        .sidebar {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 15px;
        }
        .calculator-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card {
            text-align: center;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .card img {
            width: 50px;
            height: 50px;
            margin: 10px auto;
        }
        .card-body {
            border-radius: 0 0 15px 15px;
        }
        h1 {
            color: #dc3545;
        }
        input {
            margin: 10px 0;
            padding: 8px;
            width: 50%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
<div id="header-container"></div>
<div class="container">
    <div class="sidebar">
        <div class="card p-2" onclick="loadCalculator('SIP Planner')">
            <img src="assets/money.png" alt="SIP">
            <div class="card-body bg-danger text-white">SIP Planner</div>
        </div>
        <div class="card p-2" onclick="loadCalculator('SIP Delay Cost Calculator')">
            <img src="assets/rupee-indian.png" alt="SIP Delay">
            <div class="card-body bg-danger text-white">SIP Delay Cost Calculator</div>
        </div>
        <div class="card p-2" onclick="loadCalculator('EMI Calculator')">
            <img src="assets/accounting.png" alt="EMI">
            <div class="card-body bg-danger text-white">EMI Calculator</div>
        </div>
        <div class="card p-2" onclick="loadCalculator('SIP Planner')">
            <img src="assets/home%20(1).png" alt="SIP">
            <div class="card-body bg-danger text-white">Buy a Car/Home Planner</div>
        </div>
        <div class="card p-2" onclick="loadCalculator('SIP Planner')">
            <img src="assets/graduation.png" alt="SIP">
            <div class="card-body bg-danger text-white">Education Planner</div>
        </div>
        <div class="card p-2" onclick="loadCalculator('SIP Planner')">
            <img src="assets/investment.png" alt="SIP">
            <div class="card-body bg-danger text-white">Retirement Planner</div>
        </div>
    </div>
    <div class="calculator-section">
        <h1 id="calculatorTitle">SIP Planner</h1>
        <p id="calculatorDescription">SIP is an effective way of investing regularly into a mutual fund scheme. This tool helps you calculate future wealth accumulation.</p>
        <label>Monthly Investment Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">
        <label>Investment Period:</label>
        <input type="number" id="period" placeholder="Enter years">
        <label>Expected Return:</label>
        <input type="number" id="return" placeholder="Enter return %">
        <h6 id="result"></h6>
        <button onclick="calculate()">Calculate</button>
    </div>
</div>

<script>
    function loadCalculator(calculatorName) {
        document.getElementById('calculatorTitle').innerText = calculatorName;
        document.getElementById('calculatorDescription').innerText = `This tool calculates ${calculatorName} values.`;
    }
    function calculate() {
        let amount = parseFloat(document.getElementById('amount').value);
        let period = parseFloat(document.getElementById('period').value);
        let rate = parseFloat(document.getElementById('return').value) / 100 / 12;
        let months = period * 12;

        if (isNaN(amount) || isNaN(period) || isNaN(rate)) {
            alert("Please enter valid numbers");
            return;
        }

        let futureValue = amount * ((Math.pow(1 + rate, months) - 1) / rate) * (1 + rate);
        document.getElementById('result').innerText = `Estimated Future Value: Rs. ${futureValue.toFixed(2)}`;
    }
</script>
<div id="footer-container"></div>

</body>
</html>
