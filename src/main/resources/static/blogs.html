<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Blogs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="/common.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    h2 {
      font-weight: 400;
      text-align: center;
    }
    .card {
      border: none;
      border-radius: 16px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .card img {
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      max-height: 200px;
      object-fit: cover;
    }
    .card-title {
      color: #0d6efd;
      font-weight: bold;
      margin-top: 10px;
    }
    .card-text {
      color: #555;
      margin-bottom: 1rem;
    }
    .btn-primary {
      background-color: #0056d2;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #0040a8;
    }
    #noBlogs {
      text-align: center;
      margin-top: 2rem;
      color: #888;
    }
  </style>
</head>
<body>
<!-- Common Header -->
<div id="header-container"></div>
<div class="container mt-5">
  <h2 class="mb-4 text-center">LATEST BLOGS</h2>
  <p>Explore our latest articles covering a wide range of investment topics, updated every month. Stay informed with the newest trends and market insights to make smarter and more confident investment decisions.</p>
  <p id="noBlogs" style="display:none;">No blogs found.</p>
  <div class="row" id="blogRow"></div>
</div>
<!-- Common Footer -->
<div id="footer-container"></div>

<script>
  async function loadBlogs() {
    const res = await fetch('/api/blogs');
    const blogs = await res.json();
    const row = document.getElementById('blogRow');

    if (blogs.length === 0) {
      document.getElementById('noBlogs').style.display = 'block';
      return;
    }

    blogs.forEach(blog => {
      const col = document.createElement('div');
      col.className = 'col-md-4 mb-4 d-flex';

      // Use /assets/ folder and encode image filename safely
      const imageUrl = blog.image
        ? `/assets/${encodeURIComponent(blog.image)}`
        : 'https://via.placeholder.com/600x300?text=Blog+Image';

      col.innerHTML = `
        <div class="card w-100 h-100 shadow-sm">
          <img src="${imageUrl}" class="card-img-top" alt="Blog Image" />
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${blog.title}</h5>
            <p class="card-text">${blog.shortDescription || ''}</p>
            <a href="/blog_details.html?id=${blog.id}" class="btn btn-primary mt-auto">Read More</a>
          </div>
        </div>
      `;
      row.appendChild(col);
    });
  }

  window.onload = loadBlogs;
</script>
</body>
</html>
