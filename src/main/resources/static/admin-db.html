<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8"/>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin-dashboard.css"/>

    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.2/classic/ckeditor.js"></script>
</head>
<body>

<div class="admindashboard-layout" role="application" aria-label="Admin Dashboard">

    <!-- Sidebar -->
    <aside class="admindashboard-sidebar" aria-label="Primary">
        <div class="admindashboard-brand">
            <i class="bi bi-shield-lock-fill"></i>
            <span>Admin Dashboard</span>
        </div>

        <nav class="admindashboard-navlist" id="admindashboardNav">
            <a href="#/dashboard" class="admindashboard-nav" data-route="#/dashboard"><i class="bi bi-speedometer2"></i> <span>Dashboard</span></a>
            <a href="#/clients" class="admindashboard-nav" data-route="#/clients"><i class="bi bi-people-fill"></i> <span>Clients</span></a>
            <a href="#/plans" class="admindashboard-nav" data-route="#/plans"><i class="bi bi-ui-checks-grid"></i> <span>Plans</span></a>
            <a href="#/investments" class="admindashboard-nav" data-route="#/investments"><i class="bi bi-graph-up-arrow"></i> <span>Investments</span></a>
            <a href="#/blogs" class="admindashboard-nav" data-route="#/blogs"><i class="bi bi-journal-text"></i> <span>Blogs</span></a>
            <a href="#/services" class="admindashboard-nav" data-route="#/services">
                <i class="bi bi-briefcase-fill"></i> <span>Services</span>
            </a>

            <a href="#/seo" class="admindashboard-nav" data-route="#/seo"><i class="bi bi-search"></i> <span>SEO</span></a>
            <a href="#/settings" class="admindashboard-nav" data-route="#/settings"><i class="bi bi-gear-fill"></i> <span>Settings</span></a>
            <a href="#/documents" class="admindashboard-nav" data-route="#/documents"><i class="bi bi-file-earmark-fill"></i> <span>Documents</span></a>
            <a href="#/careers" class="admindashboard-nav" data-route="#/careers"><i class="bi bi-briefcase-fill"></i> <span>Careers</span></a>
        </nav>

        <div class="admindashboard-sidebar-footer">
            <button id="admindashboardBtnLogout" class="admindashboard-btn danger" title="Logout">
                <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="admindashboard-main">
        <header class="admindashboard-topbar">
            <div class="admindashboard-top-wrap">
                <button class="admindashboard-burger" id="admindashboardBurger"><i class="bi bi-list"></i></button>
                <div class="admindashboard-search-wrap">
                    <i class="bi bi-search admindashboard-search-icon"></i>
                    <input class="admindashboard-search" id="admindashboardTopSearch" placeholder="Search clients, email"/>
                </div>
            </div>
            <div class="admindashboard-profile-nav">
                <button id="adminProfileBtn" class="admindashboard-icon-btn admindashboard-profile-btn">
                    <i class="bi bi-person-circle"></i>
                    <span id="adminNameDisplay"></span>
                    <i class="bi bi-caret-down-fill"></i>
                </button>
                <div id="adminProfileMenu" class="admindashboard-profile-menu" style="display:none;">
                    <div class="admindashboard-profile-welcome">Welcome !</div>
                    <a href="#/admin-details" class="admindashboard-nav" id="editProfileLink">
                        <i class="bi bi-person-check"></i> <span>Edit Profile</span>
                    </a>
                    <a href="#" id="dashboardLogoutLink" class="admindashboard-profile-link">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </div>
            </div>
        </header>

        <section id="admindashboardView"></section>
    </main>
</div>

<!-- Backdrop for mobile sidebar -->
<div class="admindashboard-backdrop" id="admindashboardBackdrop"></div>

<!-- ========== TEMPLATES ========== -->

<!-- Loading Card Template -->
<template id="loadingCardTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3 data-title></h3>
            <span class="admindashboard-badge">
                <i class="bi bi-arrow-repeat admindashboard-spin"></i> Loading
            </span>
        </div>
        <div class="admindashboard-skeleton"></div>
    </div>
</template>

<!-- Error Card Template -->
<template id="errorCardTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3 data-title></h3>
            <span class="admindashboard-badge danger">
                <i class="bi bi-exclamation-triangle"></i> Error
            </span>
        </div>
        <div class="admindashboard-error" data-message></div>
    </div>
</template>

<!-- Dashboard Main Template -->
<template id="dashboardMainTemplate">
    <div class="admindashboard-kpi" id="kpiContainer"></div>
    <div class="admindashboard-grid" id="chartsContainer"></div>
    <div class="admindashboard-card" id="alertsCard"></div>
</template>

<!-- KPI Card Template -->
<template id="kpiCardTemplate">
    <div class="admindashboard-kpi-card">
        <div>
            <i data-icon></i>
            <span data-label></span>
        </div>
        <div class="admindashboard-kpi-value" data-value></div>
    </div>
</template>

<!-- Chart Card Template -->
<template id="chartCardTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3><i data-icon></i> <span data-title></span></h3>
        </div>
        <canvas data-canvas height="140"></canvas>
    </div>
</template>

<!-- Leaderboard Card Template -->
<template id="leaderboardCardTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3><i class="bi bi-award-fill"></i> RM Leaderboard</h3>
        </div>
        <div class="admindashboard-list" id="leaderboardList"></div>
    </div>
</template>

<!-- Leaderboard Row Template -->
<template id="leaderboardRowTemplate">
    <div class="admindashboard-list-row">
        <div class="admindashboard-rank" data-rank></div>
        <div class="admindashboard-list-name">
            <i class="bi bi-person-badge-fill"></i>
            <span data-name></span>
        </div>
        <div class="admindashboard-list-value" data-value></div>
    </div>
</template>

<!-- Alerts Card Template -->
<template id="alertsCardTemplate">
    <div class="admindashboard-card-head">
        <h3><i class="bi bi-bell-fill"></i> Alerts</h3>
        <div class="admindashboard-card-actions" id="alertsActions"></div>
    </div>
    <ul class="admindashboard-alerts" id="alertsList"></ul>
</template>

<!-- Action Button Template -->
<template id="actionButtonTemplate">
    <button class="admindashboard-btn" data-button>
        <i data-icon></i>
        <span data-text></span>
    </button>
</template>

<!-- Alert Item Template -->
<template id="alertItemTemplate">
    <li>
        <div class="admindashboard-alert-title">
            <i class="bi bi-info-circle-fill"></i>
            <span data-title></span>
        </div>
        <div class="admindashboard-alert-sub" data-detail></div>
    </li>
</template>

<!-- Client Form Template -->
<template id="clientFormTemplate">
    <div id="clientFormContainer" class="admindashboard-card">
        <form id="clientForm">
            <input type="hidden" name="id"/>
            <div class="form-row">
                <label>Full Name:<br/>
                    <input type="text" name="fullName" class="admindashboard-input" required/>
                </label>
            </div>
            <div class="form-row">
                <label>Email:<br/>
                    <input type="email" name="email" class="admindashboard-input" required/>
                </label>
            </div>
            <div class="form-row">
                <label>Phone:<br/>
                    <input type="text" name="phone" class="admindashboard-input" required/>
                </label>
            </div>
            <div class="form-row">
                <label>Aadhaar:<br/>
                    <input type="text" name="aadhaar" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Address:<br/>
                    <input type="text" name="address" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>City:<br/>
                    <input type="text" name="city" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>State:<br/>
                    <input type="text" name="state" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Pin Code:<br/>
                    <input type="text" name="pinCode" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Annual Income:<br/>
                    <input type="number" name="annualIncome" step="0.01" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Bank Account Details:<br/>
                    <input type="text" name="bankAccountDetails" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Email Verified:<br/>
                    <select name="emailVerified" class="admindashboard-input">
                        <option value="">-- Select --</option>
                        <option value="true">Verified</option>
                        <option value="false">Not Verified</option>
                    </select>
                </label>
            </div>
            <div class="form-row">
                <label>Investment Experience:<br/>
                    <input type="text" name="investmentExperience" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Nominee Name:<br/>
                    <input type="text" name="nomineeName" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Nominee Relation:<br/>
                    <input type="text" name="nomineeRelation" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Occupation:<br/>
                    <input type="text" name="occupation" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>PAN Card:<br/>
                    <input type="text" name="panCard" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Preferred Investments:<br/>
                    <input type="text" name="preferredInvestments" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Reset Token:<br/>
                    <input type="text" name="resetToken" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-row">
                <label>Risk Profile:<br/>
                    <input type="text" name="riskProfile" class="admindashboard-input"/>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="admindashboard-btn primary">Save</button>
                <button type="button" id="cancelClientBtn" class="admindashboard-btn">Cancel</button>
            </div>
        </form>
    </div>
</template>

<!-- Blogs Container Template -->
<template id="blogsContainerTemplate">
    <button class="btn btn-primary mb-3" id="addBlogBtn">+ Add Blog</button>
    <div class="row g-3" id="blogsGrid"></div>
</template>

<!-- Blog Card Template -->
<template id="blogCardTemplate">
    <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 small-card">
            <img class="card-img-top" data-image alt="">
            <div class="card-body p-2">
                <h6 class="card-title mb-1" data-title></h6>
                <p class="card-text mb-1 small-text" data-description></p>
                <p class="text-muted mb-0">
                    <small data-meta></small>
                </p>
            </div>
            <div class="card-footer d-flex justify-content-between p-2">
                <button class="btn btn-sm btn-warning edit-blog" data-edit>Edit</button>
                <button class="btn btn-sm btn-danger delete-blog" data-delete>Delete</button>
            </div>
        </div>
    </div>
</template>

<!-- Blog Form Template -->
<template id="blogFormTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3><i class="bi bi-journal-text"></i> <span data-form-title>Add New Blog</span></h3>
            <button class="admindashboard-btn" id="backToBlogsBtn">
                <i class="bi bi-arrow-left"></i> Back to Blogs
            </button>
        </div>
        <form id="blogForm" class="admindashboard-blog-form" enctype="multipart/form-data">
            <div class="form-row">
                <label>Title: <span class="required">*</span><br/>
                    <input type="text" name="title" required class="admindashboard-input"/>
                </label>
            </div>

            <div class="form-row">
                <label>Short Description: <span class="required">*</span><br/>
                    <textarea name="shortDescription" rows="3" required class="admindashboard-textarea"></textarea>
                </label>
            </div>

            <div class="form-row">
                <label>Full Content: <span class="required">*</span><br/>
                    <textarea id="blogFullContent" name="fullContent" rows="8" class="admindashboard-textarea"></textarea>
                </label>
            </div>

            <div class="form-row">
                <label>Author: <span class="required">*</span><br/>
                    <input type="text" name="author" required class="admindashboard-input"/>
                </label>
            </div>

            <div class="form-row">
                <label>Blog Image:<br/>
                    <input type="file" name="imageFile" accept="image/*" class="admindashboard-input-file"/>
                </label>
                <div class="image-preview" id="imagePreview" style="display:none;">
                    <img id="previewImg" src="" alt="Preview" style="max-width:300px;max-height:200px;border-radius:8px;margin-top:10px;"/>
                    <div class="current-image-label">Current Image</div>
                </div>
            </div>

            <!-- SEO Information Section -->
            <div class="seo-section">
                <div class="seo-section-title"><h2>SEO Information</h2></div>

                <div class="form-row">
                    <label>Meta Title:<br/>
                        <input type="text" name="metaTitle" class="admindashboard-input"/>
                    </label>
                </div>

                <div class="form-row">
                    <label>Meta Keywords:<br/>
                        <input type="text" name="metaKeywords" class="admindashboard-input"/>
                    </label>
                </div>

                <div class="form-row">
                    <label>Meta Description:<br/>
                        <textarea name="metaDescription" rows="3" class="admindashboard-textarea"></textarea>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button class="admindashboard-btn primary" type="submit">
                    <i class="bi bi-save"></i> Save Blog
                </button>
                <button class="admindashboard-btn" type="button" id="cancelBlogBtn">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
            </div>
        </form>
        <div id="blogFormMessage" class="admindashboard-form-message"></div>
    </div>
</template>

<!-- SEO Container Template -->
<template id="seoContainerTemplate">
    <div class="admindashboard-card">
        <div class="admindashboard-card-head">
            <h3><i class="bi bi-search"></i> SEO Settings</h3>
            <button class="admindashboard-btn primary" id="addNewSeoBtn">
                <i class="bi bi-plus-circle"></i> Add New SEO Entry
            </button>
        </div>

        <!-- SEO Entries List -->
        <div id="seoEntriesList" class="seo-entries-list"></div>
    </div>

    <!-- SEO Form (Hidden by default) -->
    <div class="admindashboard-card" id="seoFormCard" style="display:none; margin-top:20px;">
        <div class="admindashboard-card-head">
            <h3><i class="bi bi-pencil-square"></i> <span id="seoFormTitle">Add SEO Entry</span></h3>
            <button class="admindashboard-btn" id="cancelSeoFormBtn">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
        </div>

        <form id="seoForm" class="admindashboard-seo-form">
            <input type="hidden" id="seoId" name="id" />

            <div class="form-row">
                <label>Slug (URL Path): <span class="required">*</span><br/>
                    <input type="text" id="seoSlug" name="slug" required class="admindashboard-input"
                           placeholder="e.g., /about-us, /services, /contact"/>
                    <small class="form-help">The URL path for this page (e.g., /about-us)</small>
                </label>
            </div>

            <div class="form-row">
                <label>Meta Title:<br/>
                    <input type="text" id="seoMetaTitle" name="metaTitle" class="admindashboard-input"
                           placeholder="Page title for search engines"/>
                    <small class="form-help">Recommended length: 50-60 characters</small>
                </label>
            </div>

            <div class="form-row">
                <label>Meta Description:<br/>
                    <textarea id="seoMetaDescription" name="metaDescription" rows="3"
                              class="admindashboard-textarea"
                              placeholder="Brief description of the page for search results"></textarea>
                    <small class="form-help">Recommended length: 150-160 characters</small>
                </label>
            </div>

            <div class="form-row">
                <label>Meta Keywords:<br/>
                    <input type="text" id="seoMetaKeywords" name="metaKeywords" class="admindashboard-input"
                           placeholder="keyword1, keyword2, keyword3"/>
                    <small class="form-help">Comma-separated keywords relevant to the page</small>
                </label>
            </div>

            <div class="form-row">
                <label>Robots Tag:<br/>
                    <select id="seoRobotsTag" name="robotsTag" class="admindashboard-input">
                        <option value="index,follow">index, follow (Default - Allow indexing)</option>
                        <option value="noindex,follow">noindex, follow (Don't index, follow links)</option>
                        <option value="index,nofollow">index, nofollow (Index, don't follow links)</option>
                        <option value="noindex,nofollow">noindex, nofollow (Don't index or follow)</option>
                    </select>
                    <small class="form-help">Controls how search engines crawl and index this page</small>
                </label>
            </div>

            <div class="form-row">
                <label>Schema JSON (Structured Data):<br/>
                    <textarea id="seoSchemaJson" name="schemaJson" rows="6"
                              class="admindashboard-textarea code-input"
                              placeholder='{"@context": "https://schema.org", "@type": "WebPage", ...}'></textarea>
                    <small class="form-help">Valid JSON-LD structured data for rich snippets</small>
                </label>
            </div>

            <div class="form-actions">
                <button class="admindashboard-btn primary" type="submit">
                    <i class="bi bi-save"></i> Save SEO Settings
                </button>
                <button class="admindashboard-btn" type="button" id="cancelSeoBtn">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
            </div>
        </form>
        <div id="seoFormMessage" class="admindashboard-form-message"></div>
    </div>
</template>

<!-- SEO Entry Card Template -->
<template id="seoEntryCardTemplate">
    <div class="seo-entry-card">
        <div class="seo-entry-header">
            <div class="seo-entry-slug">
                <i class="bi bi-link-45deg"></i>
                <span data-slug></span>
            </div>
            <div class="seo-entry-actions">
                <button class="admindashboard-btn-small primary" data-edit-seo>
                    <i class="bi bi-pencil"></i> Edit
                </button>
                <button class="admindashboard-btn-small danger" data-delete-seo>
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </div>
        <div class="seo-entry-body">
            <div class="seo-entry-field">
                <strong>Meta Title:</strong> <span data-meta-title></span>
            </div>
            <div class="seo-entry-field">
                <strong>Meta Description:</strong> <span data-meta-description></span>
            </div>
            <div class="seo-entry-field">
                <strong>Robots:</strong> <span class="admindashboard-badge" data-robots></span>
            </div>
        </div>
    </div>
</template>

<!-- Careers Container Template -->
<template id="careersContainerTemplate">
    <h2>Career Opportunities</h2>
    <table class="admindashboard-careers-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Department</th>
            <th>Location</th>
            <th>Experience</th>
            <th>Employment Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="careersTableBody"></tbody>
    </table>

    <h3>Add New Job</h3>
    <form id="addJobForm" class="admindashboard-job-form">
        <label>Title:<br/><input type="text" name="title" required class="admindashboard-input"/></label><br/><br/>
        <label>Department:<br/><input type="text" name="department" class="admindashboard-input"/></label><br/><br/>
        <label>Location:<br/><input type="text" name="location" class="admindashboard-input"/></label><br/><br/>
        <label>Experience:<br/><input type="text" name="experience" class="admindashboard-input"/></label><br/><br/>
        <label>Employment Type:<br/><input type="text" name="employmentType" class="admindashboard-input"/></label><br/><br/>
        <label>Description:<br/><textarea name="description" rows="3" class="admindashboard-textarea"></textarea></label><br/><br/>
        <label>Qualification:<br/><input type="text" name="qualification" class="admindashboard-input"/></label><br/><br/>
        <label>Salary Range:<br/><input type="text" name="salaryRange" class="admindashboard-input"/></label><br/><br/>
        <label>Posted Date:<br/><input type="date" name="postedDate" class="admindashboard-input"/></label><br/><br/>
        <label>Apply Deadline:<br/><input type="date" name="applyDeadline" class="admindashboard-input"/></label><br/><br/>
        <label>Remote Type:<br/><input type="text" name="remoteType" class="admindashboard-input"/></label><br/><br/>
        <label>Skills Required:<br/><textarea name="skillsRequired" rows="3" class="admindashboard-textarea"></textarea></label><br/><br/>
        <label>Key Responsibility:<br/><textarea name="keyResponsibility" rows="3" class="admindashboard-textarea"></textarea></label><br/><br/>
        <label>Roles and Responsibilities:<br/><textarea name="rolesAndResponsibilities" rows="3" class="admindashboard-textarea"></textarea></label><br/><br/>

        <!-- SEO Section -->
        <div class="seo-section">
            <div class="seo-section-title"><h2>SEO Information</h2></div>
            <div class="form-row">
                <label for="seoTitle">Meta Title</label>
                <input type="text" id="seoTitle" name="seoTitle" class="admindashboard-input" />
            </div>
            <div class="form-row">
                <label for="seoKeywords">Meta Keywords</label>
                <textarea id="seoKeywords" name="seoKeywords" class="admindashboard-input" rows="2"></textarea>
            </div>
            <div class="form-row">
                <label for="seoDescription">Meta Description</label>
                <textarea id="seoDescription" name="seoDescription" class="admindashboard-input" rows="2"></textarea>
            </div>
        </div>

        <button class="admindashboard-btn primary" type="submit">Add Job</button>
    </form>

    <div id="jobFormMessage" class="admindashboard-form-message"></div>
</template>

<!-- Career Row Template -->
<template id="careerRowTemplate">
    <tr>
        <td data-title></td>
        <td data-department></td>
        <td data-location></td>
        <td data-experience></td>
        <td data-employmenttype></td>
        <td>
            <button class="edit-job-btn" data-edit>Edit</button>
            <button class="delete-job-btn" data-delete>Delete</button>
        </td>
    </tr>
</template>

<!-- Edit Admin Template -->
<template id="editAdminTemplate">
    <div class="edit-admin-container">
        <h2>Edit Admin User Details</h2>
        <form id="editAdminForm">
            <label for="adminEmail">Email:</label>
