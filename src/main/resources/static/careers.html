<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career - Ongole Bulls Invest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <script src="/common.js" defer></script>
    <!-- Stylesheets -->
<!--    <link rel="stylesheet" href="/contact.css" />-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Scripts -->
    <script src="script.js" defer></script>
    <div id="header-container"></div>


    <link rel="stylesheet" href="./career.css">


    <script src="./career.js" defer></script>


</head>

<body>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="hero-section">
    <h1>Join the Ongole Bulls Invest Family</h1>
    <p>Be part of a team that is reshaping investment and wealth management across India.</p>
    <div class="hero-btns">
        <a href="#openings">View Open Positions</a>
        <a href="javascript:void(0);" onclick="showApplyForm()">Apply Now</a>
    </div>
</div>

<section class="jobs-section">
    <!-- Filters - Left -->
    <div class="filters-panel">
        <h2>Filters</h2>
        <label for="searchJobs">Search</label>
        <input
                type="text"
                id="searchJobs"
                placeholder="Search jobs..."
                oninput="searchAndRenderJobs()"
        />
        <label for="departmentFilter">Department</label>
        <select id="departmentFilter"></select>

        <label for="experienceFilter">Experience</label>
        <select id="experienceFilter"></select>

        <label for="remoteTypeFilter">Work Type</label>
        <select id="remoteTypeFilter"></select>

        <label for="locationFilter">Location</label>
        <select id="locationFilter"></select>
    </div>



    <!-- Job Openings - Right -->
    <div id="openings" class="jobs-content">
        <div class="positions-available">
            <span id="jobs-count" style="display: none;"></span>
            <h3><b>Current Opening Positions</b></h3>
        </div>

        <div class="jobs-listings" id="jobListings"  >

            <!-- Example job cards -->
            <div class="job-card">

                <a href="javascript:void(0);" onclick="showApplyForm()">Apply Now</a>
            </div>

        </div>

        <div id="pagination" class="pagination">
            <!-- Pagination controls go here -->
            <button>Previous</button>
            <button>1</button>
            <button>2</button>
            <button>Next</button>
        </div>
    </div>
</section>



<!-- Modal Structure: Place this just before </body> -->
<div id="applyModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <form class="apply-form" id="applyForm" >
            <input type="hidden" id="position" name="position" />
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required />
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required />
            <label for="phone">Mobile Number *</label>
            <input type="tel" id="phone" name="phone" required />
            <label for="gradYear">Graduation Year *</label>
            <select id="gradYear" name="gradYear" required></select>


            <label for="designationAppliedFor">Designation Applying For *</label>
            <select id="designationAppliedFor" name="designationAppliedFor" required>
                <option value="">Select designation</option>
                <!-- Options will be dynamically inserted with JavaScript -->
            </select>



            <label for="skills">Skills *</label>
            <input type="text" id="skills" name="skills" required />
            <label for="resume">Resume / CV *</label>
            <input type="file" id="resume" name="resume" required />
            <label for="anything_else_to_share">Is there anything else you would like to share with us?</label>
            <textarea id="anything_else_to_share" name="anything_else_to_share"></textarea>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</div>

<div id="footer-container"></div>
</body>
</html>
