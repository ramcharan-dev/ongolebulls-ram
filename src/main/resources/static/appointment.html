<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book an Appointment – Ongolebulls Invest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <!-- Company Logo -->
          <div class="text-center mb-4">
            <img src="assets/logo%203.png" alt="OngoleBulls Logo" style="max-width: 180px; height: auto;" />
          </div>

          <h1 class="h4 mb-3">Book Your Appointment</h1>
          <form id="appointmentForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" name="fullName" required />
              <div class="invalid-feedback">Full name is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address *</label>
              <input type="email" class="form-control" name="email" required />
              <div class="invalid-feedback">Valid email is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Mobile Number (10 digits) *</label>
              <input type="tel" pattern="^[0-9]{10}$" class="form-control" name="mobile" required />
              <div class="invalid-feedback">Enter 10 digit mobile number.</div>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Preferred Date *</label>
                <input type="date" class="form-control" name="preferredDate" required />
                <div class="invalid-feedback">Select date.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Preferred Time *</label>
                <input type="time" class="form-control" name="preferredTime" required />
                <div class="invalid-feedback">Select time.</div>
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label class="form-label">Type of Appointment *</label>
              <select class="form-select" name="type" required>
                <option value="">Select</option>
                <option value="INVESTMENT_CONSULTATION">Investment Consultation</option>
                <option value="FINANCIAL_PLANNING">Financial Planning</option>
                <option value="WEALTH_MANAGEMENT">Wealth Management</option>
                <option value="OTHERS">Others</option>
              </select>
              <div class="invalid-feedback">Select appointment type.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Message / Notes (Optional)</label>
              <textarea class="form-control" rows="3" name="notes"></textarea>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Book Appointment</button>
            </div>
            <p class="form-footer">
              By submitting the form I agree to the
              <a href="terms-and-conditions.html" target="_blank" class="footer-link">Terms and Conditions</a>
              and
              <a href="privacy-policy.html" target="_blank" class="footer-link">Privacy Policy</a>
              of Ongolebullsinvest pvt ltd India.
            </p>
          </form>
          <div id="status" class="alert mt-3 d-none" role="alert"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Bootstrap client-side validation helper
  (() => {
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();

  const form = document.getElementById('appointmentForm');
  const statusEl = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) return;

    const fd = new FormData(form);
    // Build payload matching AppointmentRequest DTO
    const payload = {
      fullName: fd.get('fullName'),
      email: fd.get('email'),
      mobile: fd.get('mobile'),
      preferredDate: fd.get('preferredDate'), // ISO yyyy-MM-dd
      preferredTime: fd.get('preferredTime'), // HH:mm
      type: fd.get('type'),
      notes: fd.get('notes') || null
    };

    try {
      const res = await fetch('/api/appointments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const json = await res.json();
      statusEl.classList.remove('d-none', 'alert-danger');
      if (json.success) {
        statusEl.classList.add('alert-success');
        statusEl.textContent = json.message || 'Your appointment has been successfully booked!';
        form.reset();
        form.classList.remove('was-validated');
        // Reset location dropdowns
        const stateField = document.getElementById('state');
        const cityField = document.getElementById('city');
        if (stateField && stateField.tagName === 'SELECT') {
          stateField.innerHTML = '<option value="">State</option>';
        } else if (stateField && stateField.tagName === 'INPUT') {
          stateField.value = '';
        }
        if (cityField && cityField.tagName === 'SELECT') {
          cityField.innerHTML = '<option value="">City</option>';
        } else if (cityField && cityField.tagName === 'INPUT') {
          cityField.value = '';
        }
        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        statusEl.classList.add('alert-danger');
        statusEl.textContent = json.message || 'Something went wrong. Please try again.';
      }
    } catch (err) {
      statusEl.classList.remove('d-none');
      statusEl.classList.add('alert-danger');
      statusEl.textContent = 'Unable to book right now. Please try again later.';
    }
  });
</script>
</body>
</html>
