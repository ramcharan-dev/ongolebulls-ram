<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Blog Details | Ongolebulls Invest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <script src="/common.js" defer></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ====== Global Reset ====== */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: "Inter", sans-serif;
          background-color: #f9fafb;
          color: #1f2937;
          line-height: 1.8;
        }

        /* ====== Container ====== */
        .blog-container {
          background: #ffffff;
          max-width: 1050px;
          margin: 60px auto;
          padding: 50px 60px;
          border-radius: 20px;
          box-shadow: 0 8px 35px rgba(0, 0, 0, 0.06);
          animation: fadeUp 0.9s ease;
        }

        /* ====== Title ====== */
        #blogTitle {
          font-size: 2.3rem;
          font-weight: 700;
          color: #0f172a;
          text-align: center;
          margin-bottom: 15px;
          letter-spacing: 0.5px;
          border-bottom: 3px solid #e11d48;
          padding-bottom: 8px;
          animation: fadeIn 1.1s ease-in;
        }

        /* ====== Meta Info ====== */
        .meta-info {
          text-align: center;
          font-size: 0.95rem;
          color: #6b7280;
          margin-bottom: 30px;
        }

        .meta-info strong {
          color: #111827;
        }

        /* ====== Image ====== */
        #blogImage {
          display: block;
          width: 100%;
          max-width: 720px;
          height: auto;
          border-radius: 14px;
          margin: 25px auto;
          object-fit: cover;
          box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
          animation: zoomIn 1.2s ease-in-out;
        }

        /* ====== Content ====== */
        #blogContent {
          font-size: 1.08rem;
          color: #374151;
          text-align: justify;
          letter-spacing: 0.2px;
        }

        #blogContent p {
          margin-bottom: 1.2rem;
        }

        #blogContent h3,
        #blogContent h4 {
          color: #1e3a8a;
          font-weight: 600;
          margin-top: 2rem;
          margin-bottom: 0.8rem;
        }

        #blogContent a {
          color: #2563eb;
          text-decoration: none;
          border-bottom: 1px solid transparent;
          transition: 0.3s;
        }

        #blogContent a:hover {
          border-color: #2563eb;
        }

        /* ====== Back Button ====== */
        .btn-secondary {
          display: block;
          margin: 40px auto 0;
          background: linear-gradient(90deg, #0f172a, #1e3a8a);
          color: #fff;
          border: none;
          border-radius: 30px;
          padding: 12px 30px;
          font-weight: 500;
          letter-spacing: 0.3px;
          transition: all 0.3s ease;
          box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary:hover {
          background: linear-gradient(90deg, #1e3a8a, #0f172a);
          transform: translateY(-2px);
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        /* ====== Footer ====== */
        #footer-container {
          text-align: center;
          margin-top: 60px;
          color: #6b7280;
          font-size: 0.9rem;
          padding-bottom: 30px;
        }

        /* ====== Animations ====== */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(25px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
          from { opacity: 0; transform: scale(0.95); }
          to { opacity: 1; transform: scale(1); }
        }

        /* ====== Responsive ====== */
        @media (max-width: 768px) {
          .blog-container {
            padding: 25px;
            margin: 25px;
          }

          #blogTitle {
            font-size: 1.8rem;
          }

          #blogContent {
            font-size: 1rem;
          }

          #blogImage {
            max-width: 100%;
            margin: 15px 0;
          }
        }
    </style>
</head>

<body>
<!-- Common Header -->
<div id="header-container"></div>

<div class="blog-container">
    <h2 id="blogTitle">Loading...</h2>
    <p class="meta-info">
        <strong>Author:</strong> <span id="blogAuthor"></span> |
        <strong>Date:</strong> <span id="blogDate"></span>
    </p>
    <img id="blogImage" style="display:none;" />
    <div id="blogContent"></div>
    <a href="/blogs.html" class="btn btn-secondary">← Back to Blogs</a>
</div>

<!-- Footer -->
<div id="footer-container">© 2025 Ongolebulls Invest | All Rights Reserved</div>

<script>
    async function loadBlog() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const res = await fetch(`/api/blogs/${id}`);

      if (!res.ok) {
        document.getElementById("blogTitle").innerText = "Blog not found.";
        document.getElementById("blogContent").innerHTML = "";
        return;
      }

      const blog = await res.json();
      document.getElementById("blogTitle").innerText = blog.title;
      document.getElementById("blogAuthor").innerText = blog.author;
      document.getElementById("blogDate").innerText = new Date(blog.createdAt).toLocaleDateString();
      document.getElementById("blogContent").innerHTML = blog.fullContent;

      if (blog.image) {
        const img = document.getElementById("blogImage");
        img.src = `/assets/${blog.image}`;
        img.style.display = "block";
      }
    }

    window.onload = loadBlog;
</script>
</body>
</html>
