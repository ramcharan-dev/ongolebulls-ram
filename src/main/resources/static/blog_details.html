<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Blog Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <script src="/common.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Container Styling */
        .container {
          background: #ffffff;
          margin: 60px auto;
          padding: 50px 60px;
          border-radius: 20px;
          box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
          animation: fadeUp 1s ease;
          transition: all 0.3s ease;
        }

        .container:hover {
          box-shadow: 0 10px 50px rgba(0, 0, 0, 0.12);
        }

        /* Blog Title */
        #blogTitle {
          font-size: 2.4rem;
          font-weight: 700;
          color: #0f172a;
          text-align: center;
          line-height: 1.3;
          margin-bottom: 20px;
          animation: fadeIn 1.2s ease-in-out;
        }

        /* Blog Image */
        #blogImage {
          display: block;
          max-width: 100%;
          border-radius: 16px;
          margin: 25px auto 30px auto;
          box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
          animation: zoomIn 1.2s ease-in-out;
        }

        /* Author + Date */
        .meta-info {
          text-align: center;
          font-size: 0.95rem;
          color: #6b7280;
          margin-bottom: 35px;
        }

        .meta-info strong {
          color: #111827;
        }

        /* Blog Content */
        #blogContent {
          font-size: 1.08rem;
          color: #374151;
          text-align: justify;
          letter-spacing: 0.2px;
        }

        #blogContent p {
          margin-bottom: 1.2rem;
        }

        #blogContent h3, #blogContent h4 {
          color: #0f172a;
          font-weight: 600;
          margin-top: 2rem;
          margin-bottom: 0.8rem;
        }

        #blogContent a {
          color: #2563eb;
          text-decoration: none;
          border-bottom: 1px solid transparent;
          transition: border-color 0.3s;
        }

        #blogContent a:hover {
          border-color: #2563eb;
        }

        /* Back Button */
        .btn-secondary {
          display: block;
          width: fit-content;
          margin: 40px auto 0;
          background: linear-gradient(90deg, #0f172a, #1e3a8a);
          color: #fff;
          border: none;
          border-radius: 30px;
          padding: 12px 30px;
          font-weight: 500;
          letter-spacing: 0.3px;
          transition: all 0.3s ease;
          box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary:hover {
          background: linear-gradient(90deg, #1e3a8a, #0f172a);
          transform: translateY(-2px);
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        /* Animations */
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
          from { opacity: 0; transform: scale(0.96); }
          to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(30px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
          .container {
            padding: 30px 25px;
          }

          #blogTitle {
            font-size: 1.8rem;
          }

          #blogContent {
            font-size: 1rem;
          }
        }
    </style>
</head>

<body>
<!-- Common Header -->
<div id="header-container">My Corporate Blog Portal</div>

<div class="container">
    <h2 id="blogTitle">Loading...</h2>

    <img id="blogImage" class="img-fluid mb-4" style="display:none;" />

    <p class="meta-info">
        <strong>Author:</strong> <span id="blogAuthor"></span> |
        <strong>Date:</strong> <span id="blogDate"></span>
    </p>

    <div id="blogContent"></div>

    <a href="/blogs.html" class="btn btn-secondary">← Back to Blogs</a>
</div>

<!-- Common Footer -->
<div id="footer-container">© 2025 My Blog | All Rights Reserved</div>

<script>
    async function loadBlog() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const res = await fetch(`/api/blogs/${id}`);

      if (!res.ok) {
        document.getElementById("blogTitle").innerText = "Blog not found.";
        document.getElementById("blogContent").innerHTML = "";
        return;
      }

      const blog = await res.json();
      document.getElementById("blogTitle").innerText = blog.title;
      document.getElementById("blogAuthor").innerText = blog.author;
      document.getElementById("blogDate").innerText = new Date(blog.createdAt).toLocaleDateString();
      document.getElementById("blogContent").innerHTML = blog.fullContent;

      if (blog.image) {
        const img = document.getElementById("blogImage");
        img.src = `/assets/${blog.image}`;
        img.style.display = "block";
      }
    }

    window.onload = loadBlog;
</script>
</body>
</html>
