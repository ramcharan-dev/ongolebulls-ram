<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    body { padding: 2rem; }
    textarea { resize: vertical; }
  </style>
  <script>
    tinymce.init({
      selector: '#shortDescription, #fullContent',
      plugins: 'lists link image table code',
      toolbar: 'undo redo | styles | bold italic underline | alignleft aligncenter alignright | bullist numlist outdent indent | code',
      menubar: false,
      height: 250
    });
  </script>
</head>
<body>
<div class="container">
  <h2>Blog Admin Panel</h2>
  <form id="blogForm" class="mb-4" enctype="multipart/form-data">
    <input type="hidden" id="blogId" />
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" id="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Short Description</label>
      <textarea id="shortDescription" class="form-control"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Full Content</label>
      <textarea id="fullContent" rows="5" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Upload Image</label>
      <input type="file" id="imageFile" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" id="author" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Save Blog</button>
    <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
  </form>

  <h4>All Blogs</h4>
  <table class="table table-bordered" id="blogsTable">
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Short Desc</th>
      <th>Author</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  async function fetchBlogs() {
    const res = await fetch('/api/blogs');
    const blogs = await res.json();
    const tbody = document.querySelector('#blogsTable tbody');
    tbody.innerHTML = '';

    blogs.forEach(blog => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${blog.id}</td>
        <td>${blog.title}</td>
        <td>${blog.shortDescription}</td>
        <td>${blog.author || ''}</td>
        <td>
          <button class="btn btn-sm btn-warning" onclick='editBlog(${JSON.stringify(blog)})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick='deleteBlog(${blog.id})'>Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function editBlog(blog) {
    document.getElementById('blogId').value = blog.id;
    document.getElementById('title').value = blog.title;
    tinymce.get('shortDescription').setContent(blog.shortDescription || '');
    tinymce.get('fullContent').setContent(blog.fullContent || '');
    document.getElementById('author').value = blog.author || '';
    // Image won't be editable in input file, so ignore for editing
  }

  async function deleteBlog(id) {
    if (!confirm("Are you sure you want to delete this blog?")) return;
    await fetch(`/api/blogs/${id}`, { method: 'DELETE' });
    fetchBlogs();
  }

  function clearForm() {
    document.getElementById('blogForm').reset();
    tinymce.get('shortDescription').setContent('');
    tinymce.get('fullContent').setContent('');
    document.getElementById('blogId').value = '';
  }

  document.getElementById('blogForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const blogId = document.getElementById('blogId').value;
    const formData = new FormData();

    formData.append('title', document.getElementById('title').value);
    formData.append('shortDescription', tinymce.get('shortDescription').getContent());
    formData.append('fullContent', tinymce.get('fullContent').getContent());
    formData.append('author', document.getElementById('author').value);

    const imageFile = document.getElementById('imageFile').files[0];
    if (imageFile) {
      formData.append('imageFile', imageFile);
    }

    const url = blogId ? `/api/blogs/${blogId}` : '/api/blogs';
    const method = blogId ? 'PUT' : 'POST';

    await fetch(url, {
      method: method,
      body: formData
    });

    clearForm();
    fetchBlogs();
  });

  fetchBlogs();
</script>
</body>
</html>
