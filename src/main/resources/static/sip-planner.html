<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-Goal SIP & Financial Calculators</title>
    <style>
        body {
          margin: 0; font-family: Arial, sans-serif;
          background: #f9f9f9;
          display: flex;
          min-height: 100vh;
        }
        .sidebar {
          width: 280px;
          background: #ddd;
          padding: 15px;
          box-sizing: border-box;
        }
        .sidebar h3 {
          color: #e64a19;
          margin-top: 0;
          margin-bottom: 15px;
          font-weight: 700;
          font-size: 1.2rem;
          text-align: center;
        }
        .menu-item {
          background: #eee;
          border-radius: 10px;
          margin-bottom: 10px;
          padding: 10px 10px 10px 60px;
          position: relative;
          cursor: pointer;
          color: #333;
          font-weight: 600;
          transition: background 0.3s;
          user-select: none;
        }
        .menu-item:hover {
          background: #f15a24;
          color: white;
        }
        .menu-item.active {
          background: #f15a24;
          color: white;
        }
        /* Icons on left inside menu items */
        .menu-item::before {
          content: "";
          position: absolute;
          left: 10px;
          top: 50%;
          transform: translateY(-50%);
          width: 32px; height: 32px;
          background: #ccc;
          border-radius: 50%;
          background-size: 60% auto;
          background-repeat: no-repeat;
          background-position: center;
          opacity: 0.5;
        }
        /* Example icons (replace with actual or font icons if you want) */
        .menu-item.sip-planner::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/piggy-bank.png'); }
        .menu-item.sip-delay::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/hourglass.png'); }
        .menu-item.sip-need::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/chart.png'); }
        .menu-item.child-education::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/graduation-cap.png'); }
        .menu-item.child-marriage::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/wedding-rings.png'); }
        .menu-item.retirement::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/old-age.png'); }
        .menu-item.single-goal::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/target.png'); }
        .menu-item.buy-home::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/home.png'); }
        .menu-item.emi-calculator::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/calendar--v1.png'); }
        .menu-item.save-tax::before { background-image: url('https://img.icons8.com/ios-filled/50/000000/percentage.png'); }

        .content {
          flex: 1;
          background: white;
          padding: 25px 40px;
          overflow-y: auto;
        }
        h2 {
          color: #f15a24;
          margin-top: 0;
          margin-bottom: 10px;
        }
        p.description {
          color: #555;
          font-size: 0.95rem;
          line-height: 1.4;
          margin-bottom: 20px;
        }
        form {
          max-width: 600px;
        }
        label {
          display: block;
          font-weight: 600;
          margin-top: 12px;
          margin-bottom: 6px;
        }
        input[type=number], input[type=text] {
          width: 100%;
          padding: 8px 10px;
          font-size: 1rem;
          border-radius: 6px;
          border: 1px solid #ccc;
        }
        input[type=checkbox] {
          transform: scale(1.2);
          margin-right: 6px;
        }
        .buttons {
          margin-top: 20px;
        }
        button {
          background: #f15a24;
          color: white;
          font-weight: 700;
          border: none;
          border-radius: 6px;
          padding: 12px 24px;
          cursor: pointer;
          margin-right: 15px;
          font-size: 1rem;
        }
        button.reset-btn {
          background: #888;
        }
        .result-area {
          margin-top: 25px;
          font-weight: 700;
          font-size: 1.1rem;
          color: #222;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Financial Planners</h3>
    <div class="menu-item sip-planner active" data-calculator="sipPlanner">SIP Planner</div>
    <div class="menu-item sip-delay" data-calculator="sipDelayCost">SIP Delay Cost Calculator</div>
    <div class="menu-item sip-need" data-calculator="sipNeedCalculator">SIP Need Calculator</div>
    <div class="menu-item child-education" data-calculator="childEducationPlanner">Child Education Planner</div>
    <div class="menu-item child-marriage" data-calculator="childMarriagePlanner">Child Marriage Planner</div>
    <div class="menu-item retirement" data-calculator="retirementPlanner">Retirement Planner</div>
    <div class="menu-item single-goal" data-calculator="singleGoalPlanner">Single Goal Planner</div>
    <div class="menu-item buy-home" data-calculator="buyCarHomePlanner">Buy a Car / Home</div>
    <div class="menu-item emi-calculator" data-calculator="emiCalculator">EMI Calculator</div>
    <div class="menu-item save-tax" data-calculator="saveTaxELSS">Save Tax with ELSS</div>
</div>

<div class="content" id="calculatorContent">
    <!-- Dynamic calculator forms will appear here -->
</div>

<script>
    const sipHistory = [];

    const form = document.getElementById('sipTrackerHistoryForm');
    const historyBody = document.getElementById('sipHistoryBody');
    const summaryDiv = document.getElementById('sipSummary');
    const resetBtn = document.getElementById('resetHistoryBtn');

    function renderHistory() {
      historyBody.innerHTML = '';
      sipHistory.forEach((entry, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${entry.monthYear}</td>
          <td>₹${entry.amount.toLocaleString('en-IN')}</td>
        `;
        historyBody.appendChild(tr);
      });
    }

    function calculateReturns() {
      const r = parseFloat(document.getElementById('expectedReturn').value) || 0;
      if (sipHistory.length === 0) {
        summaryDiv.innerHTML = 'No SIP entries added yet.';
        return;
      }

      // Sort entries by date ascending
      sipHistory.sort((a,b) => new Date(a.monthYear + '-01') - new Date(b.monthYear + '-01'));

      const today = new Date();
      let totalInvested = 0;
      let totalFV = 0;
      const monthlyRate = r / 12 / 100;

      sipHistory.forEach(entry => {
        const entryDate = new Date(entry.monthYear + '-01');
        // Months from entryDate to today (investment duration)
        let monthsInvested = Math.max(0, (today.getFullYear() - entryDate.getFullYear()) * 12 + (today.getMonth() - entryDate.getMonth()));
        totalInvested += entry.amount;
        if (monthlyRate > 0) {
          // Future value of this single SIP contribution as lump sum invested monthsInvested ago
          // FV = P * (1 + r)^n
          totalFV += entry.amount * Math.pow(1 + monthlyRate, monthsInvested);
        } else {
          totalFV += entry.amount;
        }
      });

      const totalReturns = totalFV - totalInvested;

      summaryDiv.innerHTML = `
        <p>Total Invested Amount: ₹${totalInvested.toLocaleString('en-IN')}</p>
        <p>Estimated Current Value: ₹${totalFV.toLocaleString('en-IN')}</p>
        <p>Estimated Returns Earned: ₹${totalReturns.toLocaleString('en-IN')}</p>
      `;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('monthlySIP').value);
      const monthYear = document.getElementById('sipMonth').value;
      if (!amount || !monthYear) {
        alert('Please enter valid amount and month.');
        return;
      }
      sipHistory.push({ amount, monthYear });
      renderHistory();
      calculateReturns();
      form.reset();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to reset SIP history?')) {
        sipHistory.length = 0;
        renderHistory();
        summaryDiv.innerHTML = '';
      }
    });
</script>

<script>
    const calculators = {

      // 1. SIP Planner
      sipPlanner: {
        title: "SIP Planner",
        description: `This tool can help you understand how much wealth you can accumulate in future with a monthly SIP.`,
        html: `
          <form id="sipPlannerForm">
            <label>Monthly Investment Amount (₹):</label>
            <input type="number" id="sipAmount" min="0" required />
            <label>Investment Period (Years):</label>
            <input type="number" id="investmentYears" min="1" max="50" required />
            <label>Expected Return (Annualized %):</label>
            <input type="number" id="expectedReturn" min="0" max="30" step="0.1" required />
            <div class="buttons">
              <button type="submit">Calculate</button>
              <button type="button" class="reset-btn">Reset</button>
            </div>
            <div class="result-area" id="sipPlannerResult"></div>
          </form>
        `,
        calculate: () => {
          const P = parseFloat(document.getElementById('sipAmount').value) || 0;
          const n = parseFloat(document.getElementById('investmentYears').value) || 0;
          const r = parseFloat(document.getElementById('expectedReturn').value) || 0;
          const months = n * 12;
          const monthlyRate = r / 12 / 100;
          let fv = 0;
          if (monthlyRate > 0) {
            fv = P * (((Math.pow(1 + monthlyRate, months) - 1) * (1 + monthlyRate)) / monthlyRate);
          } else {
            fv = P * months;
          }
          const totalInvested = P * months;
          const returnsEarned = fv - totalInvested;

          return `
            <p>Total Invested Amount: ₹${totalInvested.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p>Estimated Maturity Value: ₹${fv.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p>Estimated Returns Earned: ₹${returnsEarned.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
          `;
        }
      },

      // 2. SIP Delay Cost Calculator
      sipDelayCost: {
        title: "SIP Delay Cost Calculator",
        description: `Small delays in starting SIP can hugely affect your wealth accumulation over time.`,
        html: `
          <form id="sipDelayCostForm">
            <label>Monthly Investment Amount (₹):</label>
            <input type="number" id="sipAmount" min="0" required />
            <label>Investment Period (Years):</label>
            <input type="number" id="investmentYears" min="1" max="50" required />
            <label>Expected Return (Annualized %):</label>
            <input type="number" id="expectedReturn" min="0" max="30" step="0.1" required />
            <label>Delay in starting SIP from today (Months):</label>
            <input type="number" id="delayMonths" min="0" max="120" required />
            <div class="buttons">
              <button type="submit">Calculate</button>
              <button type="button" class="reset-btn">Reset</button>
            </div>
            <div class="result-area" id="sipDelayCostResult"></div>
          </form>
        `,
        calculate: () => {
          const P = parseFloat(document.getElementById('sipAmount').value) || 0;
          const n = parseFloat(document.getElementById('investmentYears').value) || 0;
          const r = parseFloat(document.getElementById('expectedReturn').value) || 0;
          const delay = parseInt(document.getElementById('delayMonths').value) || 0;
          const totalMonths = n * 12;
          const monthlyRate = r / 12 / 100;

          // Future value without delay (full period)
          let fvFull = 0;
          if (monthlyRate > 0) {
            fvFull = P * (((Math.pow(1 + monthlyRate, totalMonths) - 1) * (1 + monthlyRate)) / monthlyRate);
          } else {
            fvFull = P * totalMonths;
          }

          // Future value with delay (reduced months)
          const monthsAfterDelay = Math.max(totalMonths - delay, 0);
          let fvDelayed = 0;
          if (monthlyRate > 0) {
            fvDelayed = P * (((Math.pow(1 + monthlyRate, monthsAfterDelay) - 1) * (1 + monthlyRate)) / monthlyRate);
          } else {
            fvDelayed = P * monthsAfterDelay;
          }

          const lossDueToDelay = fvFull - fvDelayed;

          return `
            <p>Future Value without Delay: ₹${fvFull.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p>Future Value with Delay of ${delay} months: ₹${fvDelayed.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p><strong>Loss due to Delay: ₹${lossDueToDelay.toLocaleString('en-IN', {maximumFractionDigits: 0})}</strong></p>
          `;
        }
      },

      // 3. SIP Need Calculator
      sipNeedCalculator: {
        title: "SIP Need Calculator",
        description: `Calculate how much you need to invest monthly to reach your target amount in the future.`,
        html: `
          <form id="sipNeedCalculatorForm">
            <label>Investment Horizon (Years):</label>
            <input type="number" id="investmentYears" min="1" max="50" required />
            <label>Target Amount Needed (₹):</label>
            <input type="number" id="targetAmount" min="0" required />
            <label>Expected Returns on Investments (Annualized %):</label>
            <input type="number" id="expectedReturn" min="0" max="30" step="0.1" required />
            <div class="buttons">
              <button type="submit">Submit</button>
              <button type="button" class="reset-btn">Reset</button>
            </div>
            <div class="result-area" id="sipNeedCalculatorResult"></div>
          </form>
        `,
        calculate: () => {
          const n = parseFloat(document.getElementById('investmentYears').value) || 0;
          const target = parseFloat(document.getElementById('targetAmount').value) || 0;
          const r = parseFloat(document.getElementById('expectedReturn').value) || 0;

          const months = n * 12;
          const monthlyRate = r / 12 / 100;

          // Monthly SIP needed = P = FV * r / [((1 + r)^n - 1)*(1+r)]
          let P = 0;
          if (monthlyRate > 0) {
            P = target * monthlyRate / (((Math.pow(1 + monthlyRate, months) - 1) * (1 + monthlyRate)));
          } else {
            P = target / months;
          }

          return `
            <p>You need to invest approximately ₹${P.toLocaleString('en-IN', {maximumFractionDigits: 0})} monthly to reach ₹${target.toLocaleString('en-IN')} in ${n} years.</p>
          `;
        }
      },

      // 4. Child Education Planner
      childEducationPlanner: {
        title: "Child Education Planner",
        description: `Calculate investments needed to fulfill your child's higher education dreams.`,
        html: `
          <form id="childEducationPlannerForm">
            <label>Years to Maturity:</label>
            <input type="number" id="yearsToMaturity" min="1" max="50" required />
            <label>Education Cost Today (₹):</label>
            <input type="number" id="educationCost" min="0" required />
            <label>Estimated Increase in your Savings (% Yearly):</label>
            <input type="number" id="estimatedIncrease" min="0" max="50" step="0.1" value="0" />
            <label>Expected Rate of Returns (% Yearly):</label>
            <input type="number" id="expectedReturn" min="0" max="30" step="0.1" value="12" />
            <label>Expected Rate of Inflation (% Yearly):</label>
            <input type="number" id="inflation" min="0" max="30" step="0.1" value="10" />
            <div class="buttons">
              <button type="submit">Submit</button>
              <button type="button" class="reset-btn">Reset</button>
            </div>
            <div class="result-area" id="childEducationPlannerResult"></div>
          </form>
        `,
        calculate: () => {
          const years = parseFloat(document.getElementById('yearsToMaturity').value) || 0;
          const costToday = parseFloat(document.getElementById('educationCost').value) || 0;
          const increaseSavings = parseFloat(document.getElementById('estimatedIncrease').value) || 0;
          const returnRate = parseFloat(document.getElementById('expectedReturn').value) || 0;
          const inflationRate = parseFloat(document.getElementById('inflation').value) || 0;

          // Future cost = Present cost * (1 + inflation) ^ years
          const futureCost = costToday * Math.pow(1 + inflationRate / 100, years);

          // Calculate SIP needed monthly to accumulate futureCost
          const months = years * 12;
          const monthlyReturn = returnRate / 12 / 100;

          // SIP formula: P = FV*r / [((1+r)^n - 1)*(1+r)]
          let sipMonthly = 0;
          if (monthlyReturn > 0) {
            sipMonthly = futureCost * monthlyReturn / (((Math.pow(1 + monthlyReturn, months) - 1) * (1 + monthlyReturn)));
          } else {
            sipMonthly = futureCost / months;
          }

          return `
            <p>Future Education Cost (Adjusted for Inflation): ₹${futureCost.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p>Approximate Monthly SIP needed: ₹${sipMonthly.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
          `;
        }
      },

      // More calculators here following the same pattern...
      // You can add Child Marriage, Retirement, Single Goal, Buy Home/Car, EMI, Save Tax similarly

      // For demo I add one more example:

      retirementPlanner: {
        title: "Retirement Planner",
        description: `Plan your retirement investments for a confident and comfortable future.`,
        html: `
          <form id="retirementPlannerForm">
            <label>Current Age (Years):</label>
            <input type="number" id="currentAge" min="18" max="80" required />
            <label>Retirement Age (Years):</label>
            <input type="number" id="retirementAge" min="30"
            <input type="number" id="retirementAge" min="30" max="100" required />
            <label>Current Savings (₹):</label>
            <input type="number" id="currentSavings" min="0" required />
            <label>Monthly SIP Contribution (₹):</label>
            <input type="number" id="monthlyContribution" min="0" required />
            <label>Expected Annual Return (%):</label>
            <input type="number" id="expectedReturn" min="0" max="30" step="0.1" required />
            <div class="buttons">
              <button type="submit">Calculate</button>
              <button type="button" class="reset-btn">Reset</button>
            </div>
            <div class="result-area" id="retirementPlannerResult"></div>
          </form>
        `,
        calculate: () => {
          const currentAge = parseFloat(document.getElementById('currentAge').value) || 0;
          const retirementAge = parseFloat(document.getElementById('retirementAge').value) || 0;
          const currentSavings = parseFloat(document.getElementById('currentSavings').value) || 0;
          const monthlyContribution = parseFloat(document.getElementById('monthlyContribution').value) || 0;
          const expectedReturn = parseFloat(document.getElementById('expectedReturn').value) || 0;

          if (retirementAge <= currentAge) {
            return `<p style="color:red;">Retirement age must be greater than current age.</p>`;
          }

          const yearsToInvest = retirementAge - currentAge;
          const months = yearsToInvest * 12;
          const monthlyRate = expectedReturn / 12 / 100;

          // Future value of current savings
          const fvCurrentSavings = currentSavings * Math.pow(1 + monthlyRate, months);

          // Future value of monthly SIP contributions
          let fvSIP = 0;
          if (monthlyRate > 0) {
            fvSIP = monthlyContribution * (((Math.pow(1 + monthlyRate, months) - 1) * (1 + monthlyRate)) / monthlyRate);
          } else {
            fvSIP = monthlyContribution * months;
          }

          const totalFV = fvCurrentSavings + fvSIP;

          return `
            <p>Time to Invest: ${yearsToInvest} years (${months} months)</p>
            <p>Estimated Retirement Corpus: ₹${totalFV.toLocaleString('en-IN', {maximumFractionDigits: 0})}</p>
            <p>(Including Current Savings and Monthly Contributions)</p>
          `;
        }
      }
    };

    // Function to load calculator UI
    function loadCalculator(calcKey) {
      const calc = calculators[calcKey];
      if (!calc) return;

      // Update content area with calculator form and description
      document.getElementById('calculatorContent').innerHTML = `
        <h2>${calc.title}</h2>
        <p>${calc.description}</p>
        ${calc.html}
      `;

      // Setup form submit event
      const form = document.querySelector(`#${calcKey}Form`);
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          const resultHTML = calc.calculate();
          const resultArea = form.querySelector('.result-area');
          if (resultArea) {
            resultArea.innerHTML = resultHTML;
          }
        });

        // Setup reset button event
        const resetBtn = form.querySelector('.reset-btn');
        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            form.reset();
            const resultArea = form.querySelector('.result-area');
            if (resultArea) resultArea.innerHTML = '';
          });
        }
      }
    }

    // Initialize with default active calculator (sipPlanner)
    loadCalculator('sipPlanner');

    // Sidebar menu click event
    document.querySelectorAll('.sidebar .menu-item').forEach(item => {
      item.addEventListener('click', () => {
        // Remove active class from all
        document.querySelectorAll('.sidebar .menu-item').forEach(i => i.classList.remove('active'));
        // Add active to clicked
        item.classList.add('active');
        // Load calculator based on data attribute
        const calcKey = item.getAttribute('data-calculator');
        loadCalculator(calcKey);
      });
    });
</script>
</body>
</html>
