<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
          background-color: #f8f9fa;
          font-family: Arial, sans-serif;
        }
        .summary-box {
          padding: 20px;
          color: white;
          border-radius: 8px;
          font-size: 18px;
        }
        .card {
          margin-bottom: 20px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .nav-icon {
          font-size: 1.2rem;
          margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- Title -->
    <h1 class="text-center text-danger fw-bold mt-4"><i class="bi bi-speedometer2 me-2"></i>CLIENT DASHBOARD</h1>

    <!-- Top Bar -->
    <div class="row bg-white p-2 border-bottom">
        <div class="col-md-12 d-flex justify-content-between align-items-center">
            <div class="fw-bold">
                <i class="bi bi-person-circle nav-icon"></i>
                Dashboard <small class="text-muted">Welcome OngolebullsInvest</small>
            </div>
            <input class="form-control w-25" placeholder="Search for...">
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="row bg-danger text-white text-center py-2 fw-semibold">
        <div class="col"><i class="bi bi-house-door nav-icon"></i>HOME</div>
        <div class="col"><i class="bi bi-currency-rupee nav-icon"></i>FD/BONDS</div>
        <div class="col"><i class="bi bi-graph-up nav-icon"></i>MUTUAL</div>
        <div class="col"><i class="bi bi-bar-chart-line nav-icon"></i>EQUITY</div>
        <div class="col"><i class="bi bi-gem nav-icon"></i>COMMODITY</div>
        <div class="col"><i class="bi bi-file-earmark-text nav-icon"></i>REPORTS</div>
    </div>

    <!-- Summary Metrics -->
    <div class="row text-center mt-4">
        <div class="col-md-2 offset-md-1">
            <div class="summary-box bg-info">
                <i class="bi bi-cash-stack nav-icon"></i>Investment <br><strong id="metric1">0</strong>
            </div>
        </div>
        <div class="col-md-2">
            <div class="summary-box bg-success">
                <i class="bi bi-wallet2 nav-icon"></i>Current Value <br><strong id="metric2">0</strong>
            </div>
        </div>
        <div class="col-md-2">
            <div class="summary-box bg-primary">
                <i class="bi bi-graph-up-arrow nav-icon"></i>Profit/Loss <br><strong id="metric3">0</strong>
            </div>
        </div>
        <div class="col-md-2">
            <div class="summary-box bg-danger">
                <i class="bi bi-percent nav-icon"></i>Abs. Return (%) <br><strong id="metric4">0</strong>
            </div>
        </div>
        <div class="col-md-2">
            <div class="summary-box bg-warning">
                <i class="bi bi-bar-chart nav-icon"></i>XIRR (%) <br><strong id="metric5">0</strong>
            </div>
        </div>
    </div>

    <!-- Goal Cards -->
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-dark text-white"><i class="bi bi-flag nav-icon"></i>GOAL ACHIEVEMENT STATUS</div>
                <div class="card-body" id="goalStatus"></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white"><i class="bi bi-lightbulb nav-icon"></i>GOAL ACTION PLAN</div>
                <div class="card-body" id="goalPlan"></div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-dark text-white"><i class="bi bi-cash-coin nav-icon"></i>CASH FLOW (LAST 30 DAYS)</div>
                <div class="card-body">
                    <canvas id="cashFlowChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-danger text-white"><i class="bi bi-pie-chart nav-icon"></i>MY SIPs</div>
                <div class="card-body">
                    <canvas id="sipChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-success text-white"><i class="bi bi-calendar-event nav-icon"></i>UPCOMING TRANSACTION</div>
                <div class="card-body">
                    <canvas id="upcomingTxnChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Fetch Metrics
      fetch('http://localhost:8080/api/dashboard/metrics')
        .then(res => res.json())
        .then(data => {
          document.getElementById('metric1').innerText = data[0]?.metricValue || 0;
          document.getElementById('metric2').innerText = data[1]?.metricValue || 0;
          document.getElementById('metric3').innerText = data[2]?.metricValue || 0;
          document.getElementById('metric4').innerText = data[3]?.metricValue || 0;
          document.getElementById('metric5').innerText = data[4]?.metricValue || 0;

          const goalHtml = data.goals?.map(goal => `
            <div class='d-flex align-items-center mb-3'>
              <img src='https://via.placeholder.com/60' class='rounded-circle me-3'>
              <div>
                <div><strong>${goal.name}</strong></div>
                <div>${goal.achieved}% Achieved | ${goal.achievability}% Achievability</div>
                <table class='table table-sm mt-2'>
                  <tr><td>LumpSum</td><td>SIP</td></tr>
                  <tr><td>${goal.lumpsum}</td><td>${goal.sip}</td></tr>
                </table>
              </div>
            </div>
          `).join('') || 'No goals available';
          document.getElementById('goalStatus').innerHTML = goalHtml;

          const planHtml = data.goalPlans?.map(plan => `
            <div class='border-bottom py-2'>
              <div><strong>${plan.date}</strong></div>
              <div>${plan.goalName} <small>${plan.instrument}</small></div>
              <div class='text-success fw-bold'>&#8377; ${plan.amount}</div>
            </div>
          `).join('') || 'No plans available';
          document.getElementById('goalPlan').innerHTML = planHtml;
        });

      // Charts
      new Chart(document.getElementById('cashFlowChart'), {
        type: 'bar',
        data: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
          datasets: [{
            label: 'Cash Flow',
            data: [3000, 2500, 4000, 3500],
            backgroundColor: 'rgba(0,123,255,0.5)'
          }]
        }
      });

      new Chart(document.getElementById('sipChart'), {
        type: 'doughnut',
        data: {
          labels: ['SIP1', 'SIP2', 'SIP3'],
          datasets: [{
            data: [2000, 1500, 2500],
            backgroundColor: ['#dc3545', '#ffc107', '#28a745']
          }]
        }
      });

      new Chart(document.getElementById('upcomingTxnChart'), {
        type: 'line',
        data: {
          labels: ['Aug', 'Sep', 'Oct', 'Nov'],
          datasets: [{
            label: 'Upcoming Txn',
            data: [1000, 1800, 1600, 2000],
            fill: true,
            backgroundColor: 'rgba(40,167,69,0.3)',
            borderColor: '#28a745'
          }]
        }
      });
    });
</script>
</body>
</html>
