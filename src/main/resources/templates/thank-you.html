<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17764670708"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-17764670708');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You for Your Interest in ELSS Tax Saving!</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <script src="/common.js" defer></script>
  <style>
    .thankyou-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .thankyou-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .thankyou-card {
      max-width: 640px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 2.5rem 2rem;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .thankyou-icon {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      background: #dcfce7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      color: #16a34a;
      font-size: 1.75rem;
    }
    .thankyou-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1rem;
    }
    .thankyou-text {
      font-size: 1rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .thankyou-btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      background: #22c55e;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border: none;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .thankyou-btn-home i {
      margin-right: 0.5rem;
    }
    .thankyou-btn-home:hover {
      background: #16a34a;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(22, 163, 74, 0.35);
    }
    @media (max-width: 576px) {
      .thankyou-card {
        padding: 2rem 1.5rem;
      }
      .thankyou-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body class="thankyou-page">
  <div id="header-container"></div>

  <main class="thankyou-main">
    <div class="thankyou-card">
      <div class="thankyou-icon">
        <i class="fas fa-check"></i>
      </div>
      <h1 class="thankyou-title">Thank You for Your Interest in ELSS Tax Saving!</h1>
      <p class="thankyou-text">
        Your details have been successfully submitted.<br>
        Our investment advisor will connect with you within 24–48 working hours to guide you further.
      </p>
      <a href="/" class="thankyou-btn-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
      </a>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    // TODO: Replace REPLACE_WITH_CONVERSION_LABEL with actual label from Google Ads
    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
        'send_to': 'AW-17764670708/REPLACE_WITH_CONVERSION_LABEL'
      });
    }
  </script>
</body>
</html>
