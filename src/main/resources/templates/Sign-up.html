&lt;!&ndash; Scripts &ndash;&gt;
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
    // ====== Config: Replace with your actual backend endpoints ======
    const API = {
      sendEmailOtp: '/api/auth/send-otp/email',
      verifyEmailOtp: '/api/auth/verify-otp/email',
      sendMobileOtp: '/api/auth/send-otp/mobile',
      verifyMobileOtp: '/api/auth/verify-otp/mobile',
      register: '/api/auth/register'
    };

    // ====== State ======
    const totalSteps = 7;
    let currentStep = 1;
    let emailVerified = false;
    let mobileVerified = false;



// Base API URL
const API_BASE = "http://localhost:8080/api/otp";

// Helper to make POST requests
async function postData(url = "", data = {}) {
    const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
    return res.json();
}

// Send Email OTP
async function sendEmailOtp(email) {
    if (!email) {
        alert("Please enter a valid email");
        return;
    }
    const result = await postData(`${API_BASE}/send/email`, { email });
    console.log(result);
    alert(result.message);
}

// Verify Email OTP
async function verifyEmailOtp(email, otp) {
    if (!email || !otp) {
        alert("Please enter email and OTP");
        return;
    }
    const result = await postData(`${API_BASE}/verify/email`, { email, otp });
    console.log(result);
    alert(result.message);
}

// Send Mobile OTP
async function sendMobileOtp(mobile) {
    if (!mobile) {
        alert("Please enter a valid mobile number");
        return;
    }
    const result = await postData(`${API_BASE}/send/mobile`, { mobile });
    console.log(result);
    alert(result.message);
}

// Verify Mobile OTP
async function verifyMobileOtp(mobile, otp) {
    if (!mobile || !otp) {
        alert("Please enter mobile and OTP");
        return;
    }
    const result = await postData(`${API_BASE}/verify/mobile`, { mobile, otp });
    console.log(result);
    alert(result.message);
}


    // ====== Helpers ======
    const qs = (sel) => document.querySelector(sel);
    const qsa = (sel) => Array.from(document.querySelectorAll(sel));

    function showStep(n) {
      qsa('.step').forEach(s => s.classList.remove('active'));
      const dom = qs(`.step[data-step="${n}"]`);
      dom.classList.add('active');
      qs('#btnPrev').disabled = (n === 1);
      qs('#btnNext').classList.toggle('hidden', n === totalSteps);
      qs('#btnSubmit').classList.toggle('hidden', n !== totalSteps);
      const pct = Math.round((n / totalSteps) * 100);
      qs('#progressBar').style.width = pct + '%';
      qs('#progress-label').textContent = `Step ${n} of ${totalSteps}`;
      qs('#progress-section').textContent = dom.getAttribute('data-title');
    }

    function validateStep(step) {
      // basic front-end validations per step
      if (step === 1) {
        const name = qs('#fullName').value.trim();
        const email = qs('#email').value.trim();
        const mobile = qs('#mobile').value.trim();
        const pass = qs('#password').value;
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const mobileOk = /^\d{10}$/.test(mobile);
        if (!name || !emailOk || !mobileOk || pass.length < 8) {
          alert('Please fill valid Name, Email, Mobile and a strong Password (min 8 chars).');
          return false;
        }
        if (!emailVerified || !mobileVerified) {
          alert('Please verify both Email OTP and Mobile OTP before proceeding.');
          return false;
        }
      }
      if (step === 2) {
        if (qs('#forRelative').checked) {
          if (!qs('#relation').value || !qs('#relativeName').value.trim()) {
            alert('Please provide relation and relative name.');
            return false;
          }
        }
      }
      if (step === 3) {
        const pan = qs('#pan').value.trim().toUpperCase();
        const dob = qs('#dob').value;
        const gender = qs('#gender').value;
        const address = qs('#address').value.trim();
        const pincode = qs('#pincode').value.trim();
        const city = qs('#city').value.trim();
        const state = qs('#state').value.trim();
        const proof = qs('#addressProof').files[0];
        const panOk = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan);
        const pinOk = /^\d{6}$/.test(pincode);
        if (!panOk) { alert('Invalid PAN format.'); return false; }
        if (!dob || !gender || !address || !pinOk || !city || !state || !proof) {
          alert('Please complete all KYC fields and upload address proof.');
          return false;
        }
        const ext = proof.name.toLowerCase();
        if (!ext.endsWith('.pdf') && !ext.endsWith('.jpg') && !ext.endsWith('.jpeg') && !ext.endsWith('.png')) {
          alert('Address proof must be PDF/JPG/PNG.');
          return false;
        }
      }
      if (step === 4) {
        const ah = qs('#acctHolder').value.trim();
        const bn = qs('#bankName').value.trim();
        const an = qs('#accountNumber').value.trim();
        const ifsc = qs('#ifsc').value.trim().toUpperCase();
        const chq = qs('#chequeProof').files[0];
        const ifscOk = /^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc);
        if (!ah || !bn || !an || !ifscOk || !chq) {
          alert('Please complete all bank fields with a valid IFSC and upload cheque/passbook.');
          return false;
        }
      }
      if (step === 5) {
        // no blocking validation as defaults are set
      }
      if (step === 6) {
        if (!qs('#c1').checked || !qs('#c2').checked || !qs('#c3').checked || !qs('#c4').checked || !qs('#c5').checked) {
          alert('Please accept all declarations & consents to proceed.');
          return false;
        }
      }
      return true;
    }

    function updateRisk() {
      const sum = ['q1','q2','q3','q4','q5'].reduce((acc, q) => acc + parseInt((qs(`input[name="${q}"]:checked`)||{value:1}).value), 0);
      qs('#riskScore').textContent = String(sum);
      let cat = 'Conservative';
      if (sum >= 11) cat = 'Aggressive';
      else if (sum >= 8) cat = 'Moderate';
      qs('#riskCategory').textContent = cat;
      return { score: sum, category: cat };
    }

    // Password strength (simple heuristic)
    function pwStrength(pw) {
      let s = 0;
      if (pw.length >= 8) s++;
      if (/[A-Z]/.test(pw)) s++;
      if (/[a-z]/.test(pw)) s++;
      if (/\d/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return Math.min(s, 5);
    }
    function renderStrength(pw) {
      const s = pwStrength(pw);
      const pct = (s / 5) * 100;
      const fill = qs('#strengthFill');
      fill.style.width = pct + '%';
      fill.style.background = s <= 2 ? '#ff5f5f' : (s === 3 ? '#ffbd4f' : '#30d158');
      qs('#strengthText').textContent = s <= 2 ? 'Weak' : (s === 3 ? 'Medium' : 'Strong');
    }

    qs('#btnSubmit').addEventListener('click', async () => {
