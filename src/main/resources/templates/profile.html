<h2 xmlns:th="http://www.w3.org/1999/xhtml">My Profile</h2>

<!-- View Section -->
<div id="viewSection">
    <p><b>Name:</b> <span th:text="${user.fullName}"></span></p>
    <p><b>Email:</b> <span th:text="${user.email}"></span></p>
    <p><b>DOB:</b> <span th:text="${user.dob}"></span></p>
    <p><b>Gender:</b> <span th:text="${user.gender}"></span></p>
    <p><b>Address:</b> <span th:text="${user.address}"></span></p>
    <p><b>Mobile:</b> <span th:text="${user.mobile}"></span></p>
    <button onclick="toggleEdit()">Edit Profile</button>
</div>

<!-- Edit Section -->
<div id="editSection" style="display: none;">
    <form action="/user/update" method="post">
        <label>Name</label>
        <input type="text" name="fullName" th:value="${user.fullName}" />

        <label>Address</label>
        <input type="text" name="address" th:value="${user.address}" />

        <label>Mobile</label>
        <input type="text" name="mobile" th:value="${user.mobile}" />

        <button type="submit">Save Changes</button>
        <button type="button" onclick="toggleEdit()">Cancel</button>
    </form>
</div>

<script>
    function toggleEdit() {
      const view = document.getElementById('viewSection');
      const edit = document.getElementById('editSection');
      if(view.style.display === 'none') {
        view.style.display = 'block';
        edit.style.display = 'none';
      } else {
        view.style.display = 'none';
        edit.style.display = 'block';
      }
    }
</script>
