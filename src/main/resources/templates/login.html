<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ongolebulls Invest - Auth</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          padding: 20px;
          background: #f8f8f8;
        }

        .container {
          background: white;
          padding: 30px;
          border-radius: 10px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
          width: 400px;
          text-align: center;
          overflow-y: auto;
          max-height: 90vh;
        }

        .logo {
          width: 100px;
          margin-bottom: 20px;
        }

        .form-container {
          display: none;
          text-align: left;
        }

        .form-container.active {
          display: block;
        }

        input,
        select,
        textarea {
          width: 92%;
          padding: 10px;
          margin: 8px 0;
          border: 1px solid #ccc;
          border-radius: 5px;
          font-size: 14px;
        }

        button {
          width: 100%;
          padding: 12px;
          background: #ff4500;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          font-size: 16px;
          margin-top: 10px;
        }

        a {
          color: #ff4500;
          cursor: pointer;
          text-decoration: underline;
        }

        .account-option {
          display: flex;
          justify-content: center;
          margin: 20px 0;
          font-size: 18px;
          color: #333;
        }

        .account-option input[type="radio"] {
          margin: 0 10px;
          transform: scale(1.2);
          cursor: pointer;
        }

        .account-option label {
          margin: 0 15px;
          cursor: pointer;
        }

        h2 {
          text-align: center;
          margin-bottom: 15px;
        }

        /* Scroll inside container for register form */
        #register-form {
          max-height: 75vh;
          overflow-y: auto;
          padding-right: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="assets/logo 3.png" alt="Ongolebulls Logo" class="logo" />

    <p class="tagline">Invest Smart Grow Big.</p>
    <h2>Welcome to Ongolebulls Invest</h2>

    <p class="account-option">
        <input
                type="radio"
                id="login-option"
                name="account-option"
                onclick="showLoginForm()"
                checked
        />
        <label for="login-option">Login</label>

        <input
                type="radio"
                id="register-option"
                name="account-option"
                onclick="showRegisterForm()"
        />
        <label for="register-option">Register</label>
    </p>

    <!-- LOGIN FORM -->
    <div class="form-container active" id="login-form">
        <input
                type="text"
                id="login-username"
                placeholder="Username or Email"
                required
        />
        <input type="password" id="login-password" placeholder="Password" required />
        <input type="text" id="login-verification-code" placeholder="Verification Code" required />
        <button onclick="loginUser()">Login</button>
        <p><a onclick="showForgotPassword()">Forgot Password?</a></p>
        <p>
            Don't have an account?
            <a onclick="showRegister()">Register</a>
        </p>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-container" id="register-form">
        <h2>Register</h2>
        <input
                type="text"
                id="username"
                name="username"
                placeholder="User Name"
                required
        />
        <input
                type="text"
                id="fname"
                name="firstName"
                placeholder="First Name"
                required
        />
        <input
                type="text"
                id="lname"
                name="lastName"
                placeholder="Last Name"
                required
        />
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                required
        />
        <input
                type="text"
                id="mobile"
                name="mobile"
                placeholder="Mobile Number"
                required
        />
        <input
                type="password"
                id="register-password"
                name="password"
                placeholder="Password"
                required
        />
        <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm Password"
                required
        />

        <input
                type="text"
                id="pan"
                name="pan"
                placeholder="PAN Card Number"
                required
        />
        <input
                type="text"
                id="aadhaar"
                name="aadhaar"
                placeholder="Aadhaar Number (optional)"
        />
        <label for="dob">Date of Birth</label><br />
        <input type="date" id="dob" name="dob" required />
        <br />
        <label for="gender">Gender</label><br />
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <textarea
                id="address"
                name="address"
                placeholder="Residential Address"
                rows="3"
                required
        ></textarea>
        <input
                type="text"
                id="occupation"
                name="occupation"
                placeholder="Occupation"
                required
        />
        <label for="incomeBracket">Annual Income Bracket</label><br />
        <select id="incomeBracket" name="incomeBracket" required>
            <option value="">Select Income Bracket</option>
            <option value="<2L">&lt; 2 Lakhs</option>
            <option value="2L-5L">2-5 Lakhs</option>
            <option value="5L-10L">5-10 Lakhs</option>
            <option value=">10L">&gt; 10 Lakhs</option>
        </select>

        <h3>Bank Details</h3>
        <input
                type="text"
                id="bankName"
                name="bankName"
                placeholder="Bank Name"
                required
        />
        <input
                type="text"
                id="ifscCode"
                name="ifscCode"
                placeholder="IFSC Code"
                required
        />
        <input
                type="text"
                id="accountNumber"
                name="accountNumber"
                placeholder="Account Number"
                required
        />

        <h3>Nominee Details (Optional)</h3>
        <input
                type="text"
                id="nomineeName"
                name="nomineeName"
                placeholder="Nominee Name"
        />
        <input
                type="text"
                id="nomineeRelation"
                name="nomineeRelation"
                placeholder="Nominee Relation"
        />
        <input
                type="number"
                id="nomineeAge"
                name="nomineeAge"
                placeholder="Nominee Age"
                min="0"
        />

        <button onclick="registerUser()">Register</button>
        <p>
            Already have an account?
            <a onclick="showLogin()">Login</a>
        </p>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div class="form-container" id="forgot-password-form">
        <h2>Reset Password</h2>
        <input
                type="text"
                id="reset-username"
                placeholder="Username or Mobile"
                required
        />
        <input type="password" id="new-password" placeholder="New Password" required />
        <button onclick="resetPassword()">Reset Password</button>
        <p>
            Back to <a onclick="showLogin()">Login</a>
        </p>
    </div>
</div>

<script>
    function showLogin() {
      document.getElementById("login-form").classList.add("active");
      document.getElementById("register-form").classList.remove("active");
      document.getElementById("forgot-password-form").classList.remove("active");
      document.getElementById("login-option").checked = true;
    }

    function showRegister() {
      document.getElementById("login-form").classList.remove("active");
      document.getElementById("register-form").classList.add("active");
      document.getElementById("forgot-password-form").classList.remove("active");
      document.getElementById("register-option").checked = true;
    }

    function showForgotPassword() {
      document.getElementById("login-form").classList.remove("active");
      document.getElementById("register-form").classList.remove("active");
      document.getElementById("forgot-password-form").classList.add("active");
    }

     document.addEventListener("DOMContentLoaded", function () {
    document.querySelector("#login-form button").addEventListener("click", loginUser);
  });

  function loginUser() {
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;
    const verificationCode = document.getElementById("login-verification-code").value;

    console.log("Login Clicked", username, password, verificationCode); // DEBUG

    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, verificationCode }),
    })
      .then((response) => {
        if (!response.ok) {
          throw new Error("Login failed. Status: " + response.status);
        }
        return response.text();
      })
      .then((data) => {
        if (data === "Login successful!") {
          alert("Login successful!");
          sessionStorage.setItem("username", username);
          window.location.href = "client-dashboard.html";
        } else {
          alert(data);
        }
      })
      .catch((error) => {
        console.error("Error during login:", error);
        alert("An error occurred. Please try again later.");
      });
  }

    function registerUser() {
      const username = document.getElementById("username").value.trim();
      const fname = document.getElementById("fname").value.trim();
      const lname = document.getElementById("lname").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("register-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const pan = document.getElementById("pan").value.trim();
      const aadhaar = document.getElementById("aadhaar").value.trim();
      const dob = document.getElementById("dob").value;
      const gender = document.getElementById("gender").value;
      const address = document.getElementById("address").value.trim();
      const occupation = document.getElementById("occupation").value.trim();
      const incomeBracket = document.getElementById("incomeBracket").value;
      const bankName = document.getElementById("bankName").value.trim();
      const ifscCode = document.getElementById("ifscCode").value.trim();
      const accountNumber = document.getElementById("accountNumber").value.trim();
      const nomineeName = document.getElementById("nomineeName").value.trim();
      const nomineeRelation = document.getElementById("nomineeRelation").value.trim();
      const nomineeAge = document.getElementById("nomineeAge").value.trim();

      // Basic validations
      if (
        !username ||
        !fname ||
        !lname ||
        !email ||
        !mobile ||
        !password ||
        !confirmPassword ||
        !pan ||
        !dob ||
        !gender ||
        !address ||
        !occupation ||
        !incomeBracket ||
        !bankName ||
        !ifscCode ||
        !accountNumber
      ) {
        alert("Please fill all the required fields.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      // TODO: Add more validations as needed (email format, password strength, mobile pattern etc.)

      fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          fname,
          lname,
          email,
          mobile,
          password,
          pan,
          aadhaar,
          dob,
          gender,
          address,
          occupation,
          incomeBracket,
          bankName,
          ifscCode,
          accountNumber,
          nomineeName,
          nomineeRelation,
          nomineeAge,
        }),
      })
        .then((res) => res.text())
        .then((data) => alert(data))
        .catch((err) => {
          console.error(err);
          alert("An error occurred during registration.");
        });
    }

    function resetPassword() {
      const resetUsername = document.getElementById("reset-username").value.trim();
      const newPassword = document.getElementById("new-password").value;

      if (!resetUsername || !newPassword) {
        alert("Please fill both fields.");
        return;
      }

      fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ resetUsername, newPassword }),
      })
        .then((res) => res.text())
        .then((data) => alert(data))
        .catch((err) => {
          console.error(err);
          alert("An error occurred. Please try again later.");
        });
    }

    function showLoginForm() {
      document.getElementById("login-form").classList.add("active");
      document.getElementById("register-form").classList.remove("active");
    }

    function showRegisterForm() {
      document.getElementById("login-form").classList.remove("active");
      document.getElementById("register-form").classList.add("active");
    }
</script>
</body>
</html>
