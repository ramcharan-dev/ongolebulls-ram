<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/your-fa-kit.js" crossorigin="anonymous"></script>
    <style>
        body { background: #f5f7fa; }
        .login-card {
          max-width: 400px; margin: 80px auto; padding: 30px;
          background: white; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="login-card">
    <h4 class="text-center mb-4"><i class="fas fa-user-shield"></i> Investor Login</h4>
    <form id="loginForm">
        <div class="mb-3 d-flex justify-content-center">
            <img src="assets/logo 3.png" alt="Logo" style="height:100px;">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Sign in</button>

        <!-- Links -->
        <div class="mt-3 text-center">
            <p class="mb-0">
                New user?
                <a th:href="@{/Sign-up}" class="text-primary fw-bold">Signup</a>
            </p>
            <p class="mb-0">
                <a href="#" onclick="openForgotPassword()">Forgot Password?</a>
            </p>
        </div>
    </form>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="email" id="resetEmail" class="form-control" placeholder="Enter your registered email">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="sendResetRequest()">Send Reset Link</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Login form
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      };

      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
          const user = await response.json();
          // Store as 'loggedInUser' to match dashboard expectations
          // Ensure all required fields are present
          const userData = {
            id: user.id,
            fullName: user.fullName || user.email,
            email: user.email,
            mobileNumber: user.mobileNumber || '',
            username: user.email
          };
          localStorage.setItem("loggedInUser", JSON.stringify(userData));
          window.location.href = "/user-db.html";
        } else {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.error || "Invalid login credentials!");
        }
    });

    // Forgot password
    function openForgotPassword() {
        let modal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
        modal.show();
    }

    function sendResetRequest() {
        const email = document.getElementById("resetEmail").value;
        if (!email) {
            alert("Please enter your email.");
            return;
        }

        fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        })
        .then(res => {
            if (res.ok) {
                alert("Password reset link sent to your email.");
                bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal')).hide();
            } else {
                alert("Error sending reset link. Try again.");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Something went wrong.");
        });
    }
</script>
</body>
</html>
