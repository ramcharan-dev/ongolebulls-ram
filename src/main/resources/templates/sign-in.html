<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OngoleBulls Invest – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #d0d6df; color: #e8eefc; display:flex; min-height:100vh; align-items:center; }
        .card { background: #a1aabe; border: 1px solid #1f2a44; }
        .form-label { font-weight:600; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="mb-3">Welcome back</h2>
                    <p class="small text-secondary">Login to continue to your dashboard</p>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Email or Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="mb-3">
                            <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
                        </div>


                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="link-light link-underline-opacity-25">Forgot password?</a>
                        </div>

                        <button type="button" id="btnLogin" class="btn btn-primary w-100">Login</button>
                        <div id="loginStatus" class="mt-3"></div>

                        <div class="text-center mt-4">
                            <span class="small">New to OngoleBulls Invest?</span>
                            <a class="small" href="sign-up.html">Create an account</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- <script src="https://www.google.com/recaptcha/api.js" async defer></script> -->
<script>
    const API_LOGIN = '/api/auth/login';

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('loginStatus').innerHTML = '<div class="text-warning">Please enter username and password.</div>';
        return;
      }

      // const recaptcha = (window.grecaptcha && grecaptcha.getResponse()) || '';

      document.getElementById('btnLogin').disabled = true;
      document.getElementById('loginStatus').innerHTML = '<div class="text-info">Signing in…</div>';

      try {
        const res = await fetch(API_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password /*, recaptcha */ })
        });

        if (!res.ok) throw new Error('Invalid credentials');

        const data = await res.json().catch(() => ({}));
        if (data && data.token) {
          localStorage.setItem('authToken', data.token);
        }
        document.getElementById('loginStatus').innerHTML = '<div class="text-success">Login successful! Redirecting…</div>';
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch (e) {
        console.error(e);
        document.getElementById('loginStatus').innerHTML = '<div class="text-danger">Login failed. Please check your credentials.</div>';
        document.getElementById('btnLogin').disabled = false;
      }
    });


  document.getElementById('btnLogin').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const recaptcha = (window.grecaptcha && grecaptcha.getResponse()) || '';

    if (!username || !password) {
      alert('Please enter both username and password.');
      return;
    }
    if (!recaptcha) {
      alert('Please complete the CAPTCHA.');
      return;
    }

    document.getElementById('btnLogin').disabled = true;
    document.getElementById('loginStatus').innerHTML = '<div class="text-info">Logging in…</div>';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, recaptcha })
      });

      if (!res.ok) throw new Error('Invalid credentials or server error');

      document.getElementById('loginStatus').innerHTML = '<div class="text-success">Login successful! Redirecting…</div>';
      setTimeout(() => window.location.href = '/dashboard', 1000);

    } catch (err) {
      document.getElementById('loginStatus').innerHTML = '<div class="text-danger">' + err.message + '</div>';
      document.getElementById('btnLogin').disabled = false;
    }
  });


</script>
</body>
</html>
